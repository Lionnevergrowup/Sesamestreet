<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1f4a34">
<title>咕噜的美食餐车 · Gulu's Foodie Truck</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="scene" class="scene"></div>

    <div id="hud">
      <div class="hud-left">
        <button id="btn-home" class="icon-btn" title="回到首页" aria-label="回到首页">
          <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </button>
        <button id="btn-sound" class="icon-btn" title="声音开关" aria-label="声音开关">
          <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.7 5.8a9 9 0 0 1 0 12.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-lang" class="icon-btn text-btn" title="切换语言" aria-label="切换语言">EN</button>
      </div>
      <div class="hud-right">
        <div id="stars" class="stars-badge" aria-live="polite">
          <svg viewBox="0 0 24 24"><path d="m12 2 3 6.5 7 .9-5.1 4.8 1.3 7L12 17.8 5.8 21.2l1.3-7L2 9.4l7-.9z"/></svg>
          <span id="star-count">0</span>
        </div>
      </div>
    </div>

    <div id="fx" aria-hidden="true"></div>
  </div>
</div>

<div id="rotate-hint">
  <div class="rotate-inner">
    <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M9 19h6" stroke="#1f4a34" stroke-width="1.4" stroke-linecap="round"/></svg>
    <p data-i18n="rotate">把设备横过来玩更好哦！</p>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/recipes.js"></script>
<script src="js/i18n.js"></script>
<script src="js/game.js"></script>
</body>
</html>
