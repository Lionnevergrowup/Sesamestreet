<meta charset="utf-8">
<title>&#21653;&#22108;&#30340;&#32654;&#39135;&#39184;&#36710; &#183; Gulu's Foodie Truck</title>

<style>
/* ------------------------------------------------------------------
   style.css — 咕噜的美食餐车
   固定 1280×720 舞台，整体等比缩放到任意屏幕。
------------------------------------------------------------------ */

:root {
  --ink:   #2b2340;
  --cream: #fff6e6;
  --sun:   #ffd23f;
  --grass: #4aa86b;
  --deep:  #1f4a34;
  --grape: #8b5fe0;
  --shadow: 0 8px 0 rgba(43,35,64,.22);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #14352a;
  font-family: "Nunito", "Baloo 2", "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  user-select: none;
  touch-action: manipulation;
}

#viewport {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 40%, #2b6b4d, #14352a 70%);
}

#stage {
  position: relative;
  width: 1280px;
  height: 720px;
  flex: none;
  overflow: hidden;
  border-radius: 26px;
  background: #cfe8dd;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
  transform-origin: center center;
}

/* ---------------- 场景骨架 ---------------- */

.scene { position: absolute; inset: 0; opacity: 1; transition: opacity .18s ease; }
.scene.fade { opacity: 0; }

.bg { position: absolute; inset: 0; }
.bg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.layer { position: absolute; inset: 0; }
.pos   { position: absolute; }
.pos > svg, .pos svg { width: 100%; height: auto; display: block; }

.fg { position: absolute; inset: 0; pointer-events: none; }

#fx { position: absolute; inset: 0; pointer-events: none; z-index: 60; }

/* ---------------- HUD ---------------- */

#hud {
  position: absolute;
  inset: 14px 16px auto 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 50;
  pointer-events: none;
}
.hud-left, .hud-right { display: flex; gap: 10px; pointer-events: auto; }

.icon-btn {
  width: 52px; height: 52px;
  border: none; border-radius: 16px;
  background: rgba(255, 246, 230, .92);
  color: var(--deep);
  box-shadow: 0 4px 0 rgba(43, 35, 64, .2);
  cursor: pointer;
  display: grid; place-items: center;
  transition: transform .1s ease;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43, 35, 64, .2); }
.icon-btn svg { width: 26px; height: 26px; fill: currentColor; }
.icon-btn.text-btn { font-size: 18px; font-weight: 800; }

.ico-off { display: none; }
body.muted .ico-on  { display: none; }
body.muted .ico-off { display: block; }

.stars-badge {
  display: flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 20px 0 14px;
  border-radius: 16px;
  background: rgba(255, 246, 230, .92);
  box-shadow: 0 4px 0 rgba(43, 35, 64, .2);
  font-size: 24px; font-weight: 900; color: var(--deep);
}
.stars-badge svg { width: 28px; height: 28px; fill: var(--sun); }

/* ---------------- 通用组件 ---------------- */

.big-btn {
  border: none;
  border-radius: 999px;
  padding: 18px 44px;
  font-size: 30px;
  font-weight: 900;
  font-family: inherit;
  color: #fff;
  background: linear-gradient(180deg, #ff9a3c, #f4722c);
  box-shadow: 0 8px 0 #c9541c, 0 12px 24px rgba(0, 0, 0, .18);
  cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
  white-space: nowrap;
}
.big-btn:hover { filter: brightness(1.05); }
.big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #c9541c; }
.big-btn.bottom {
  position: absolute; left: 50%; bottom: 34px;
  transform: translateX(-50%);
  z-index: 20;
}
.big-btn.bottom:active { transform: translateX(-50%) translateY(6px); box-shadow: 0 2px 0 #c9541c; }
/* 接单场景：按钮直接挂在对话气泡下面 */
.big-btn.under-bubble { position: absolute; right: 96px; top: 288px; z-index: 20; }

.banner {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  max-width: 720px;
  padding: 12px 34px;
  border-radius: 999px;
  background: rgba(255, 246, 230, .95);
  box-shadow: var(--shadow);
  font-size: 30px; font-weight: 900; color: var(--deep);
  text-align: center;
  z-index: 20;
}

.chip {
  position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
  padding: 8px 22px;
  border-radius: 999px;
  background: rgba(43, 35, 64, .55);
  color: #fff6e6;
  font-size: 20px; font-weight: 700;
  z-index: 20;
}
.chip.bottom-chip { top: auto; bottom: 28px; }

.card {
  background: var(--cream);
  border-radius: 28px;
  padding: 26px 28px;
  box-shadow: 0 12px 0 rgba(43, 35, 64, .18), 0 24px 50px rgba(0, 0, 0, .2);
}

/* 顶部飘字提示 */
.toast {
  position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
  padding: 12px 28px; border-radius: 999px;
  background: #fff;
  font-size: 24px; font-weight: 800; color: var(--ink);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .2);
  animation: toastIn .3s cubic-bezier(.2,1.4,.4,1);
  z-index: 70;
}
.toast.warn { background: #ffe8a8; color: #8a5a12; }
.toast.good { background: #cdf0d8; color: #1f4a34; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(.9); } }

/* 飞行中的道具 / 碎片 */
.fly { position: absolute; transform: translate(-50%, -50%); z-index: 65; }
.fly svg { width: 100%; height: 100%; }
.particle {
  position: absolute; width: 16px; height: 16px;
  border-radius: 4px;
  transform: translate(-50%, -50%);
}
.particle.confetti { width: 14px; height: 22px; border-radius: 3px; transform: none; }

/* ---------------- 动画 ---------------- */

@keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
@keyframes sway  {
  0%,100% { transform: rotate(calc(var(--rot) - 5deg)) scale(var(--sc)); }
  50%     { transform: rotate(calc(var(--rot) + 5deg)) scale(var(--sc)); }
}
@keyframes popIn {
  0%   { opacity: 0; transform: scale(.5); }
  70%  { opacity: 1; transform: scale(1.08); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes walkIn {
  from { opacity: 0; transform: translateX(300px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes shakeIt {
  0%,100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-10px) rotate(-5deg); }
  40% { transform: translateX(10px) rotate(5deg); }
  60% { transform: translateX(-7px) rotate(-3deg); }
  80% { transform: translateX(7px) rotate(3deg); }
}
@keyframes bumpIt {
  0%,100% { transform: scale(1) translateY(0); }
  35% { transform: scale(1.07, .93) translateY(6px); }
  70% { transform: scale(.97, 1.05) translateY(-6px); }
}
@keyframes nudgeIt { 0%,100% { transform: scale(1); } 40% { transform: scale(1.14) rotate(-6deg); } }

.bob    { animation: bob 2.6s ease-in-out infinite; }
.float  { animation: float 2.4s ease-in-out infinite; }
.pop-in { animation: popIn .45s cubic-bezier(.2,1.5,.4,1) both; }
.walk-in{ animation: walkIn .6s cubic-bezier(.2,.8,.3,1) both, bob 2.6s ease-in-out .6s infinite; }
.shake  { animation: shakeIt .45s ease; }
.bump   { animation: bumpIt .4s ease; }
.nudge  { animation: nudgeIt .35s ease; }

/* ---------------- 首页 & 通关页 ---------------- */

.truck-title { left: 10px; bottom: 22px; width: 540px; }
.chef-title  { left: 520px; bottom: 30px; width: 250px; }

.title-card { right: 46px; top: 74px; width: 470px; position: absolute; text-align: center; }
.title-card h1 { font-size: 46px; line-height: 1.15; color: var(--deep); }
.title-card .sub { margin: 10px 0 20px; font-size: 21px; font-weight: 700; color: #7a6a55; }
.title-card .big-btn { margin-bottom: 20px; }

.how { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
.how-item { display: flex; align-items: center; gap: 10px; }
.how-art { width: 48px; height: 48px; flex: none; display: grid; place-items: center; }
.how-art svg { width: 100%; height: 100%; }
.how-item span { font-size: 16px; font-weight: 700; line-height: 1.25; color: #5c5040; }
.how-item b {
  display: inline-grid; place-items: center;
  width: 20px; height: 20px; margin-right: 6px;
  border-radius: 50%; background: var(--grape); color: #fff;
  font-size: 13px; vertical-align: 1px;
}

.crowd {
  position: absolute; left: 40px; bottom: 20px;
  display: flex; align-items: flex-end; gap: 6px;
}
.crowd-one { width: 140px; }
.crowd-one svg { width: 100%; height: auto; }
/* 通关页：主厨站到右边，别挡住排队道谢的客人 */
.sc-finale .chef-title { left: 832px; bottom: 24px; width: 212px; }

/* ---------------- 接单 / 上菜 ---------------- */

.truck-side { left: -30px; bottom: 34px; width: 610px; }
.chef-side  { left: 520px; bottom: 40px; width: 235px; }
.cust-order { right: 130px; bottom: 46px; width: 260px; }
.cust-order.happy { animation: bumpIt .5s ease 2; }

.bubble {
  position: absolute; right: 60px; top: 96px; width: 400px;
  background: var(--cream);
  border-radius: 28px;
  padding: 20px 24px;
  display: flex; align-items: center; gap: 18px;
  box-shadow: 0 10px 0 rgba(43,35,64,.18), 0 20px 40px rgba(0,0,0,.18);
  z-index: 15;
}
.bubble::after {
  content: ''; position: absolute; bottom: -22px; right: 90px;
  border: 16px solid transparent;
  border-top-color: var(--cream); border-bottom: 0;
  filter: drop-shadow(0 8px 0 rgba(43,35,64,.14));
}
.bubble-dish { width: 92px; height: 92px; flex: none; }
.bubble-dish svg { width: 100%; height: 100%; }
.bubble p { font-size: 26px; font-weight: 900; color: var(--deep); line-height: 1.25; }

.serve-dish { left: 752px; bottom: 152px; width: 160px; cursor: grab; z-index: 25; }
.serve-dish.grabbing { cursor: grabbing; }
.dish-inner { position: relative; }
.dish-inner svg { width: 100%; height: auto; position: relative; z-index: 2; }
.plate {
  position: absolute; left: 50%; bottom: -14px;
  width: 190px; height: 34px; margin-left: -95px;
  border-radius: 50%;
  background: #fffdf7;
  box-shadow: 0 8px 0 #d9d2c2, 0 16px 26px rgba(0,0,0,.22);
}

/* ---------------- 开车 ---------------- */

.road-scroll { display: flex; width: 200%; animation: roadRun 3s linear infinite; }
.road-scroll svg { position: relative; width: 50%; height: 100%; flex: none; }
@keyframes roadRun { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.drive-truck {
  left: 50%; bottom: 78px; width: 620px; margin-left: -310px;
  animation: bumpy .32s ease-in-out infinite;
}
@keyframes bumpy {
  0%,100% { transform: translateY(0) rotate(-.5deg); }
  50%     { transform: translateY(-9px) rotate(.5deg); }
}
.puff {
  position: absolute; left: -10px; bottom: 30px;
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,.9);
  animation: puffOut 1s linear infinite;
}
.puff.p2 { animation-delay: .5s; width: 34px; height: 34px; }
@keyframes puffOut {
  from { opacity: .8; transform: translate(0,0) scale(.5); }
  to   { opacity: 0;  transform: translate(-150px,-40px) scale(1.6); }
}

/* ---------------- 采集 ---------------- */

.forage-item {
  position: absolute;
  width: 118px; height: 118px;
  margin: -59px 0 0 -59px;
  border: none; background: none; padding: 0;
  cursor: pointer;
  filter: drop-shadow(0 8px 8px rgba(20,50,35,.3));
  animation: sway 3.2s ease-in-out infinite;
  z-index: 10;
}
.forage-item svg { width: 100%; height: 100%; }
.forage-item:hover { filter: drop-shadow(0 8px 12px rgba(20,50,35,.45)) brightness(1.06); }
.forage-item.shake { animation: shakeIt .45s ease; }

.basket-hud {
  position: absolute; left: 24px; bottom: 22px;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 22px 12px 14px;
  border-radius: 26px;
  background: rgba(255, 246, 230, .95);
  box-shadow: var(--shadow);
  z-index: 30;
}
.basket-art { width: 78px; flex: none; }
.basket-art svg { width: 100%; height: auto; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; max-width: 250px; }
.slot {
  width: 40px; height: 40px; border-radius: 12px;
  background: rgba(43, 35, 64, .1);
  display: grid; place-items: center;
}
.slot.full { background: rgba(74, 168, 107, .22); animation: popIn .35s cubic-bezier(.2,1.5,.4,1); }
.slot svg { width: 100%; height: 100%; }
.count { font-size: 34px; font-weight: 900; color: var(--deep); }
.count em { font-style: normal; font-size: 22px; opacity: .55; }

.chef-forage { right: 40px; bottom: 30px; width: 200px; z-index: 25; }

/* ---------------- 下厨 ---------------- */

.recipe-card { position: absolute; left: 34px; top: 92px; width: 320px; padding: 20px 22px; }
.recipe-card h3 { font-size: 24px; color: var(--deep); margin-bottom: 12px; text-align: center; }
.recipe-card ol { list-style: none; display: grid; gap: 10px; }
.recipe-card li {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 16px;
  background: rgba(43, 35, 64, .06);
  transition: background .2s ease;
}
.recipe-card li .num {
  width: 30px; height: 30px; flex: none;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--grape); color: #fff; font-size: 17px;
}
.recipe-card li .ing { width: 44px; height: 44px; flex: none; }
.recipe-card li .ing svg { width: 100%; height: 100%; }
.recipe-card li .nm { font-size: 21px; font-weight: 800; color: #5c5040; flex: 1; }
.recipe-card li .tick { font-size: 24px; font-weight: 900; color: var(--grass); opacity: 0; }
.recipe-card li.done { background: rgba(74, 168, 107, .2); }
.recipe-card li.done .tick { opacity: 1; }
.recipe-card li.done .nm { color: var(--deep); }
.recipe-card li.now {
  background: var(--sun);
  box-shadow: 0 0 0 4px rgba(255, 210, 63, .45);
  animation: nowPulse 1.4s ease-in-out infinite;
}
@keyframes nowPulse { 0%,100% { box-shadow: 0 0 0 4px rgba(255,210,63,.45); } 50% { box-shadow: 0 0 0 12px rgba(255,210,63,0); } }

.appliance-wrap { left: 690px; bottom: 244px; width: 290px; z-index: 12; }
.appliance-wrap svg { width: 100%; height: auto; }
.appliance-wrap.ready { filter: drop-shadow(0 0 22px rgba(255, 210, 63, .8)); }

.steam {
  position: absolute; left: 50%; top: -30px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,.85);
  opacity: 0;
}
.appliance-wrap.ready .steam { animation: steamUp 2.2s ease-in-out infinite; }
.steam.s1 { margin-left: -46px; animation-delay: .1s; }
.steam.s2 { margin-left: -8px; animation-delay: .8s; }
.steam.s3 { margin-left: 26px; animation-delay: 1.5s; }
@keyframes steamUp {
  0%   { opacity: 0; transform: translateY(0) scale(.5); }
  35%  { opacity: .8; }
  100% { opacity: 0; transform: translateY(-90px) scale(1.5); }
}

.chef-cook { left: 400px; bottom: 232px; width: 210px; z-index: 12; }

.shelf {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
  display: flex; gap: 14px;
  padding: 16px 20px;
  border-radius: 26px;
  background: rgba(255, 246, 230, .95);
  box-shadow: var(--shadow);
  z-index: 30;
}
.ing-tile {
  width: 122px; padding: 10px 6px 8px;
  border: none; border-radius: 20px;
  background: #fff;
  box-shadow: 0 5px 0 rgba(43, 35, 64, .16);
  cursor: grab;
  display: grid; justify-items: center; gap: 2px;
  font-family: inherit;
  touch-action: none;
  transition: box-shadow .1s ease;
}
.ing-tile svg { width: 74px; height: 74px; }
.ing-tile span { font-size: 18px; font-weight: 800; color: #5c5040; }
.ing-tile.grabbing { cursor: grabbing; box-shadow: 0 14px 22px rgba(0,0,0,.28); z-index: 40; position: relative; }
.ing-tile:disabled, .ing-tile.used { opacity: .32; cursor: default; box-shadow: none; }

.cook-controls {
  position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
  width: 480px; text-align: center;
  z-index: 30;
  transition: opacity .3s ease, transform .3s ease;
}
.cook-controls.hide { opacity: 0; transform: translateX(-50%) translateY(30px); pointer-events: none; }
.cook-controls .big-btn { width: 100%; }
.progress {
  margin: 14px auto 8px; width: 100%; height: 22px;
  border-radius: 999px; background: rgba(43,35,64,.28); overflow: hidden;
}
.progress i { display: block; height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--sun), #7ad48f); transition: width .18s ease; }
.cook-controls .hint { font-size: 18px; font-weight: 700; color: #fff6e6;
  text-shadow: 0 2px 6px rgba(0,0,0,.5); }

/* 做好的菜端到台面正中央亮个相 */
.dish-pop {
  left: 50%; margin-left: -115px; bottom: 148px; width: 230px;
  animation: popIn .5s cubic-bezier(.2,1.6,.4,1) both, float 2.4s ease-in-out .5s infinite;
  z-index: 35;
  filter: drop-shadow(0 12px 16px rgba(0,0,0,.3));
}

/* ---------------- 过关面板 ---------------- */

.overlay {
  position: absolute; inset: 0; z-index: 55;
  display: grid; place-items: center;
  background: rgba(20, 40, 32, .55);
  backdrop-filter: blur(3px);
}
.panel { width: 460px; text-align: center; }
.panel h2 { font-size: 40px; color: var(--deep); }
.panel .sub { margin: 6px 0 22px; font-size: 24px; font-weight: 700; color: #7a6a55; }
.big-star { width: 120px; height: 120px; margin: -70px auto 8px;
  animation: popIn .6s cubic-bezier(.2,1.7,.4,1) both; }
.big-star svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 12px rgba(0,0,0,.25)); }

/* ---------------- 无障碍 ---------------- */

/* 键盘操作时看得见焦点在哪 */
.big-btn:focus-visible,
.icon-btn:focus-visible,
.ing-tile:focus-visible,
.forage-item:focus-visible {
  outline: 5px solid #2b2340;
  outline-offset: 4px;
}

/*
  有人对动效敏感。角色的呼吸、叶子摇晃、路面滚动这些氛围动画一律停掉，
  但食材飞进锅里、庆祝的碎片这些是游戏反馈，保留。
*/
@media (prefers-reduced-motion: reduce) {
  .bob, .float, .walk-in, .forage-item.sway,
  .road-scroll, .drive-truck, .puff,
  .appliance-wrap.ready .steam, .recipe-card li.now {
    animation: none !important;
  }
  .scene { transition: none; }
}

/* ---------------- 竖屏提示 ---------------- */

#rotate-hint { display: none; }
@media (orientation: portrait) and (max-width: 900px) {
  #rotate-hint {
    display: grid; place-items: center;
    position: fixed; inset: 0; z-index: 100;
    background: #1f4a34; color: var(--cream); text-align: center; padding: 30px;
  }
  .rotate-inner svg { width: 90px; height: 90px; fill: var(--cream);
    animation: tilt 1.8s ease-in-out infinite; }
  .rotate-inner p { margin-top: 18px; font-size: 22px; font-weight: 800; }
  @keyframes tilt { 0%,100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
}
</style>

<div id="viewport">
  <div id="stage">
    <div id="scene" class="scene"></div>

    <div id="hud">
      <div class="hud-left">
        <button id="btn-home" class="icon-btn" title="&#22238;&#21040;&#39318;&#39029;" aria-label="&#22238;&#21040;&#39318;&#39029;">
          <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </button>
        <button id="btn-sound" class="icon-btn" title="&#22768;&#38899;&#24320;&#20851;" aria-label="&#22768;&#38899;&#24320;&#20851;">
          <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.7 5.8a9 9 0 0 1 0 12.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-lang" class="icon-btn text-btn" title="&#20999;&#25442;&#35821;&#35328;" aria-label="&#20999;&#25442;&#35821;&#35328;">EN</button>
      </div>

<script>
/* ------------------------------------------------------------------
   audio.js \u2014 \u7528 WebAudio \u73b0\u573a\u5408\u6210\u97f3\u6548\uff0c\u4e0d\u4f9d\u8d56\u4efb\u4f55\u5916\u90e8\u6587\u4ef6\u3002
   All sound effects are synthesised with WebAudio \u2014 no asset files,
   so the game works offline / straight off the filesystem.
------------------------------------------------------------------ */

const Sound = (() => {
  let ctx = null;
  let master = null;
  let enabled = localStorage.getItem('gulu.sound') !== 'off';

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.35;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /* \u4e00\u4e2a\u57fa\u7840\u97f3\u7b26\uff1a\u6ce2\u5f62 + \u97f3\u91cf\u5305\u7edc */
  function note(freq, {
    type = 'sine', at = 0, dur = 0.22, gain = 0.5,
    attack = 0.008, glide = 0, detune = 0
  } = {}) {
    if (!enabled || !ensure()) return;
    const t = ctx.currentTime + at;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.detune.value = detune;
    osc.frequency.setValueAtTime(freq, t);
    if (glide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * glide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* \u566a\u58f0\u8109\u51b2\uff0c\u7528\u6765\u505a\u201c\u6c99\u6c99\u201d\u201c\u5636\u5636\u201d\u4e00\u7c7b\u7684\u58f0\u97f3 */
  function noise({ at = 0, dur = 0.3, gain = 0.2, freq = 1200, q = 1 } = {}) {
    if (!enabled || !ensure()) return;
    const t = ctx.currentTime + at;
    const frames = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(g).connect(master);
    src.start(t);
    src.stop(t + dur);
  }

  /* C \u5927\u8c03\u4e94\u58f0\u97f3\u9636\uff0c\u600e\u4e48\u5f39\u90fd\u597d\u542c \u2014\u2014 \u9002\u5408\u8fde\u7eed\u91c7\u96c6\u65f6\u9010\u7ea7\u5347\u9ad8 */
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];

  return {
    get enabled() { return enabled; },

    toggle() {
      enabled = !enabled;
      localStorage.setItem('gulu.sound', enabled ? 'on' : 'off');
      if (enabled) { ensure(); this.tap(); }
      return enabled;
    },

    unlock() { ensure(); },

    /* \u6309\u94ae\u8f7b\u70b9 */
    tap() {
      note(660, { type: 'triangle', dur: 0.08, gain: 0.28 });
    },

    /* \u6458\u5230\u4e00\u4e2a\u98df\u6750\uff0c\u97f3\u9ad8\u968f\u7bee\u5b50\u91cc\u7684\u6570\u91cf\u5f80\u4e0a\u8d70 */
    pick(index = 0) {
      const f = SCALE[Math.min(index, SCALE.length - 1)];
      note(f, { type: 'triangle', dur: 0.18, gain: 0.4 });
      note(f * 2, { type: 'sine', at: 0.02, dur: 0.14, gain: 0.14 });
    },

    /* \u6458\u9519\u4e86 \u2014\u2014 \u4e0d\u523a\u8033\uff0c\u53ea\u662f\u201c\u54a6\uff1f\u201d */
    oops() {
      note(320, { type: 'sine', dur: 0.16, gain: 0.3, glide: 0.75 });
      note(240, { type: 'sine', at: 0.1, dur: 0.18, gain: 0.22 });
    },

    /* \u4e1c\u897f\u98de\u8fc7\u53bb */
    whoosh() {
      noise({ dur: 0.28, gain: 0.12, freq: 900, q: 0.7 });
    },

    /* \u98df\u6750\u6389\u8fdb\u9505\u91cc */
    plop() {
      note(420, { type: 'sine', dur: 0.16, gain: 0.4, glide: 0.5 });
      noise({ at: 0.02, dur: 0.12, gain: 0.08, freq: 500 });
    },

    /* \u6405\u62cc / \u714e / \u70e4 \u7684\u5faa\u73af\u58f0 */
    cookStep(i = 0) {
      noise({ dur: 0.16, gain: 0.14, freq: 700 + i * 120, q: 2 });
      note(180 + i * 24, { type: 'sawtooth', dur: 0.14, gain: 0.12 });
    },

    /* \u83dc\u505a\u597d\u4e86 */
    ding() {
      note(1046.5, { type: 'sine', dur: 0.5, gain: 0.4 });
      note(1567.98, { type: 'sine', at: 0.06, dur: 0.45, gain: 0.2 });
    },

    /* \u987e\u5ba2\u5403\u5f97\u5f88\u5f00\u5fc3 */
    yum() {
      [0, 0.12, 0.24].forEach((t, i) =>
        note([392, 523.25, 659.25][i], { type: 'triangle', at: t, dur: 0.22, gain: 0.35 }));
    },

    /* \u8fc7\u5173\u5c0f\u53f7\u89d2 */
    fanfare() {
      const seq = [523.25, 659.25, 783.99, 1046.5];
      seq.forEach((f, i) => {
        note(f, { type: 'triangle', at: i * 0.11, dur: 0.3, gain: 0.4 });
        note(f * 1.5, { type: 'sine', at: i * 0.11 + 0.01, dur: 0.26, gain: 0.14 });
      });
      note(1046.5, { type: 'triangle', at: 0.5, dur: 0.6, gain: 0.4 });
    },

    /* \u9910\u8f66\u5f15\u64ce */
    engine() {
      note(90, { type: 'sawtooth', dur: 0.9, gain: 0.12, glide: 1.25 });
      noise({ dur: 0.9, gain: 0.06, freq: 300, q: 0.6 });
      note(520, { type: 'square', at: 0.05, dur: 0.12, gain: 0.18 });
      note(660, { type: 'square', at: 0.2, dur: 0.14, gain: 0.18 });
    }
  };
})();
</script>

<script>
/* ------------------------------------------------------------------
   art.js \u2014 \u5168\u90e8\u7f8e\u672f\u90fd\u662f\u8fd9\u91cc\u73b0\u753b\u7684\u539f\u521b SVG\uff0c\u6ca1\u6709\u4efb\u4f55\u5916\u90e8\u56fe\u7247\u3002
   Every visual is original SVG generated here \u2014 no image assets,
   no third-party characters.
------------------------------------------------------------------ */

const Art = (() => {

  /* ---------- \u901a\u7528\u5c0f\u5de5\u5177 / helpers ---------- */

  const svg = (inner, vb = '0 0 100 100', cls = '') =>
    `<svg class="${cls}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

  /* \u6bdb\u8338\u8338\u7684\u8f6e\u5ed3\uff1a\u6cbf\u692d\u5706\u4e00\u5708\u753b\u5916\u51f8\u7684\u5c0f\u5706\u5f27 */
  function furPath(cx, cy, rx, ry, n = 22) {
    const pt = i => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry];
    };
    let [x0, y0] = pt(0);
    let d = `M${x0.toFixed(1)} ${y0.toFixed(1)}`;
    for (let i = 1; i <= n; i++) {
      const [x, y] = pt(i), [px, py] = pt(i - 1);
      const r = (Math.hypot(x - px, y - py) / 2) * 1.18;
      d += `A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return d + 'Z';
  }

  /* \u4e00\u53cc\u4f1a\u770b\u4eba\u7684\u5927\u773c\u775b */
  function eyes(cx, cy, r, gap, look = [0, 0], happy = false) {
    const [lx, ly] = look;
    const one = ex => happy
      ? `<path d="M${ex - r} ${cy} q${r} ${-r * 1.1} ${r * 2} 0" fill="none"
           stroke="#2b2340" stroke-width="${r * 0.42}" stroke-linecap="round"/>`
      : `<circle cx="${ex}" cy="${cy}" r="${r}" fill="#fffdf7"/>
         <circle cx="${ex}" cy="${cy}" r="${r}" fill="none" stroke="#2b2340" stroke-width="2" opacity=".18"/>
         <circle cx="${ex + lx * r * 0.34}" cy="${cy + ly * r * 0.34}" r="${r * 0.46}" fill="#2b2340"/>
         <circle cx="${ex + lx * r * 0.34 - r * 0.16}" cy="${cy + ly * r * 0.34 - r * 0.18}" r="${r * 0.16}" fill="#fff"/>`;
    return one(cx - gap / 2) + one(cx + gap / 2);
  }

  /* \u4e00\u7247\u53f6\u5b50\uff08\u4e1b\u6797\u80cc\u666f\u7528\uff09 */
  const leaf = (x, y, rot, s, fill, vein = 'rgba(255,255,255,.22)') => `
    <g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
      <path d="M0 0C34-46 104-52 150-6 104 44 34 44 0 0Z" fill="${fill}"/>
      <path d="M4 0C50 6 104 2 146-5" fill="none" stroke="${vein}" stroke-width="3" stroke-linecap="round"/>
    </g>`;

  /* ---------- \u4e3b\u53a8\u5495\u565c / the chef ---------- */
  /*
     pose: idle | cook | cheer | drive
     \u5b8c\u5168\u539f\u521b\u7684\u7d2b\u8272\u6bdb\u602a\uff0c\u6234\u53a8\u5e08\u5e3d\u3001\u7cfb\u56f4\u88d9\u3002
  */
  function chef(pose = 'idle', look = [0, 0.15]) {
    const FUR = '#8b5fe0', FUR_D = '#6b41c0', BELLY = '#b494f2';
    const armL = { idle: 'rotate(14 58 168)', cook: 'rotate(-38 58 168)', cheer: 'rotate(-72 58 168)', drive: 'rotate(-30 58 168)' }[pose];
    const armR = { idle: 'rotate(-14 162 168)', cook: 'rotate(38 162 168)', cheer: 'rotate(72 162 168)', drive: 'rotate(26 162 168)' }[pose];
    const mouth = pose === 'cheer'
      ? `<path d="M84 132q26 34 52 0q-4 26-26 26t-26-26Z" fill="#3a2456"/>
         <path d="M96 150q14 14 28 0q-6-6-14-6t-14 6Z" fill="#f4718f"/>`
      : `<path d="M86 132q24 24 48 0" fill="none" stroke="#3a2456" stroke-width="7" stroke-linecap="round"/>`;

    return svg(`
      <defs>
        <radialGradient id="chefBelly" cx=".5" cy=".35">
          <stop offset="0" stop-color="${BELLY}"/><stop offset="1" stop-color="${FUR}"/>
        </radialGradient>
      </defs>
      <ellipse cx="110" cy="252" rx="72" ry="10" fill="rgba(31,74,52,.18)"/>

      <!-- \u817f -->
      <rect x="76" y="216" width="26" height="34" rx="13" fill="${FUR_D}"/>
      <rect x="118" y="216" width="26" height="34" rx="13" fill="${FUR_D}"/>
      <ellipse cx="86" cy="248" rx="20" ry="9" fill="#3a2456"/>
      <ellipse cx="134" cy="248" rx="20" ry="9" fill="#3a2456"/>

      <!-- \u8eab\u4f53 + \u56f4\u88d9 -->
      <path d="${furPath(110, 186, 54, 46, 20)}" fill="${FUR}"/>
      <path d="M78 152h64a10 10 0 0 1 10 10v42a32 32 0 0 1-32 32h-20a32 32 0 0 1-32-32v-42a10 10 0 0 1 10-10Z" fill="#fff6e6"/>
      <path d="M98 152q12 10 24 0" fill="none" stroke="#ffb03a" stroke-width="6" stroke-linecap="round"/>
      <circle cx="110" cy="192" r="15" fill="none" stroke="#ffb03a" stroke-width="5"/>

      <!-- \u624b\u81c2 -->
      <g transform="${armL}">

      </g>
      <g transform="${armR}">
        <rect x="146" y="158" width="34" height="22" rx="11" fill="${FUR}"/>

      </g>

      <!-- \u5934 -->
      <path d="${furPath(110, 100, 62, 56, 24)}" fill="url(#chefBelly)"/>
      <!-- \u89e6\u89d2 -->
      <path d="M84 50c-6-16-14-22-22-24" fill="none" stroke="${FUR_D}" stroke-width="6" stroke-linecap="round"/>
      <path d="M136 50c6-16 14-22 22-24" fill="none" stroke="${FUR_D}" stroke-width="6" stroke-linecap="round"/>
      <circle cx="60" cy="24" r="9" fill="#ffd23f"/>

      ${eyes(110, 88, 22, 46, look, pose === 'cheer')}

      ${mouth}

      <!-- \u53a8\u5e08\u5e3d -->
      <path d="M68 60h84v-8a12 12 0 0 0-12-12H80a12 12 0 0 0-12 12Z" fill="#f0e6d2"/>
      <circle cx="82" cy="30" r="22" fill="#fffdf7"/>

      <rect x="68" y="42" width="84" height="20" rx="8" fill="#fffdf7"/>
    `, '0 0 220 268', 'art-chef');
  }

  /* ---------- \u987e\u5ba2 / customers ---------- */

  const CUSTOMERS = {
    birdie: { c: '#ffcb3d', d: '#e0a212', shape: 'round', top: 'tuft', beak: true },
    pip:    { c: '#ff8a5c', d: '#e2653a', shape: 'wide',  top: 'ears' },
    moss:   { c: '#5fbf7d', d: '#3d9a5c', shape: 'round', top: 'leaf' },
    nib:    { c: '#5aa8e8', d: '#3a83c4', shape: 'tall',  top: 'antenna' },
    lulu:   { c: '#f38fc4', d: '#d466a2', shape: 'wide',  top: 'buns' }
  };

  function customer(id, happy = false, look = [0, 0]) {
    const k = CUSTOMERS[id] || CUSTOMERS.birdie;
    const dims = { round: [56, 56], wide: [64, 48], tall: [46, 62] }[k.shape];
    const [rx, ry] = dims;
    const cy = 116;

      antenna: `<path d="M100 ${cy - ry}v-26" stroke="${k.d}" stroke-width="6" stroke-linecap="round"/>
                <circle cx="100" cy="${cy - ry - 32}" r="11" fill="#ffd23f"/>`,

             <circle cx="144" cy="${cy - ry + 10}" r="20" fill="${k.d}"/>`
    };

    const face = k.beak
      ? `<path d="M100 118l16 10-16 12-16-12Z" fill="#ff9f1c"/>`

  /* ---------- \u98df\u6750 / ingredients ---------- */

    const a = i * 2.4, r = 16 + (i % 3) * 6;

  const ING = {
    banana: `

    strawberry: `

      ${seeds(9)}
      <path d="M50 40 32 28l10 14-20 1 18 7Zm0 0 18-12-10 14 20 1-18 7Z" fill="#4fae63"/>
      <path d="M50 38V22" stroke="#3d8a4e" stroke-width="6" stroke-linecap="round"/>`,

    tomato: `
      <circle cx="50" cy="60" r="33" fill="#e8453c"/>
      <path d="M28 44c6-8 16-12 24-12" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".35"/>
      <path d="M50 32 30 20l8 16-20 4 22 6 12-4 12 4 22-6-20-4 8-16Z" fill="#4fae63"/>
      <path d="M50 32V16" stroke="#3d8a4e" stroke-width="7" stroke-linecap="round"/>`,

    carrot: `
      <path d="M50 96 30 46c-3-8 3-14 20-14s23 6 20 14Z" fill="#f4842c"/>
      <path d="M36 56h28M39 68h22M43 80h14" stroke="#d96a15" stroke-width="4" stroke-linecap="round"/>
      <path d="M50 34c-2-14-12-20-22-20 2 12 8 18 22 20Z" fill="#4fae63"/>
      <path d="M50 34c2-14 12-20 22-20-2 12-8 18-22 20Z" fill="#5fc274"/>
      <path d="M50 32V12" stroke="#3d8a4e" stroke-width="6" stroke-linecap="round"/>`,

    blueberry: `
      <circle cx="36" cy="64" r="21" fill="#4a5fc1"/>
      <circle cx="68" cy="58" r="17" fill="#5a72d8"/>
      <circle cx="53" cy="80" r="14" fill="#3d4fa8"/>
      <path d="M36 48l-5-6 7 3 3-7 3 7 7-3-5 6Z" fill="#2f3d85"/>
      <path d="M68 45l-4-5 6 2 2-5 2 5 6-2-4 5Z" fill="#2f3d85"/>
      <circle cx="29" cy="57" r="5" fill="#fff" opacity=".38"/>`,

    milk: `
      <path d="M28 40h44v46a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8Z" fill="#fdfdfd"/>
      <path d="M28 40 50 18l22 22Z" fill="#eef2f6"/>
      <path d="M28 40 50 18v22Z" fill="#dfe7ee"/>
      <rect x="28" y="56" width="44" height="20" fill="#5aa8e8"/>
      <ellipse cx="50" cy="66" rx="11" ry="7" fill="#fff"/>
      <path d="M44 66q6-9 12 0-6 5-12 0Z" fill="#5aa8e8"/>`,

    ice: `
      <path d="M22 40 50 26l28 14v32L50 86 22 72Z" fill="#a8dcf0"/>
      <path d="M22 40 50 54l28-14L50 26Z" fill="#d6f0fa"/>
      <path d="M50 54v32L22 72V40Z" fill="#8ccbe6"/>

<script>
/* ------------------------------------------------------------------
   game.js \u2014 \u573a\u666f\u72b6\u6001\u673a\u4e0e\u4ea4\u4e92
   Scene state machine: title \u2192 order \u2192 drive \u2192 forage \u2192 cook \u2192 serve
------------------------------------------------------------------ */

(() => {
  const stage = document.getElementById('stage');
  const sceneEl = document.getElementById('scene');
  const fxEl = document.getElementById('fx');
  const starCountEl = document.getElementById('star-count');
  const W = 1280, H = 720;
  let scale = 1;
  let busy = false;               // \u573a\u666f\u5207\u6362\u4e2d\uff0c\u5c4f\u853d\u8f93\u5165
  const t = (k, v) => I18N.t(k, v);

  /* ---------------- \u6e38\u620f\u72b6\u6001 ---------------- */
  const S = {
    phase: 'title',
    level: 0,
    stars: +(localStorage.getItem('gulu.stars') || 0),
    forage: null,
    cook: null,
    serve: null
  };

  const level = () => LEVELS[S.level];

  /* ---------------- \u821e\u53f0\u7f29\u653e ---------------- */
  function fit() {
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 120));

  /* ---------------- \u5c0f\u5de5\u5177 ---------------- */

  const shuffle = a => {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  /* \u5143\u7d20\u5728\u821e\u53f0\u5750\u6807\u7cfb\u91cc\u7684\u4f4d\u7f6e */
  function box(el) {
    const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
    const x = (r.left - s.left) / scale, y = (r.top - s.top) / scale;
    const w = r.width / scale, h = r.height / scale;
    return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
  }

  /* \u8ba9\u4e00\u4e2a\u4e1c\u897f\u4ece A \u98de\u5230 B\uff08\u5e26\u4e00\u70b9\u629b\u7269\u7ebf\uff09 */
  function flyItem(html, fromEl, toEl, opts = {}) {
    if (!fromEl || !toEl) { opts.onDone && opts.onDone(); return; }
    const a = box(fromEl), b = box(toEl);
    const el = document.createElement('div');
    el.className = 'fly';
    el.innerHTML = html;
    el.style.left = a.cx + 'px';
    el.style.top = a.cy + 'px';
    el.style.width = a.w + 'px';
    el.style.height = a.h + 'px';
    fxEl.appendChild(el);
    Sound.whoosh();
    const dx = b.cx - a.cx, dy = b.cy - a.cy;
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
      { transform: `translate(-50%,-50%) translate(${dx * 0.5}px,${dy * 0.5 - 110}px) scale(1.2) rotate(12deg)`, opacity: 1, offset: 0.55 },
      { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${opts.endScale ?? 0.45})`, opacity: 0.85 }
    ], { duration: opts.dur ?? 520, easing: 'cubic-bezier(.35,.05,.3,1)' });
    anim.onfinish = () => { el.remove(); opts.onDone && opts.onDone(); };
  }

  /* \u5f69\u8272\u5c0f\u788e\u7247\u7206\u5f00 */
  function burst(el, n = 14, colors = ['#ffd23f', '#ef4b52', '#5fbf7d', '#5aa8e8', '#8b5fe0']) {
    if (!el) return;
    const b = box(el);
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'particle';
      p.style.left = b.cx + 'px';
      p.style.top = b.cy + 'px';
      p.style.background = colors[i % colors.length];
      if (i % 3 === 0) p.style.borderRadius = '50%';
      fxEl.appendChild(p);
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.6;
      const d = 90 + Math.random() * 140;
      p.animate([
        { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 60}px) scale(.3) rotate(${Math.random() * 540 - 270}deg)`, opacity: 0 }
      ], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.2,.6,.4,1)' })
        .onfinish = () => p.remove();
    }
  }

  /* \u9876\u90e8\u98d8\u4e00\u53e5\u63d0\u793a */
  let toastTimer = null;
  function toast(text, kind = '') {
    const old = fxEl.querySelector('.toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = text;
    fxEl.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 1900);
  }

  function shake(el) {
    if (!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  /* \u62d6\u62fd\uff08\u4e5f\u652f\u6301\u76f4\u63a5\u70b9\u4e00\u4e0b\uff09\u2014\u2014\u5bf9\u5c0f\u670b\u53cb\u6765\u8bf4\u547d\u4e2d\u5224\u5b9a\u653e\u5bbd 80px */
  function draggable(el, { targetEl, onRelease }) {
    let sx = 0, sy = 0, moved = false, active = false;
    el.addEventListener('pointerdown', e => {
      if (busy) return;
      active = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      el.setPointerCapture(e.pointerId);
      el.classList.add('grabbing');
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!active) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 10) moved = true;
      if (moved) el.style.transform = `translate(${dx / scale}px,${dy / scale}px) scale(1.12)`;
    });
    const end = e => {
      if (!active) return;
      active = false;
      el.classList.remove('grabbing');
      el.style.transform = '';
      let hit = !moved;                       // \u76f4\u63a5\u70b9\u4e00\u4e0b = \u547d\u4e2d
      const target = typeof targetEl === 'function' ? targetEl() : targetEl;
      if (moved && target) {
        const s = stage.getBoundingClientRect();
        const px = (e.clientX - s.left) / scale, py = (e.clientY - s.top) / scale;
        const b = box(target), pad = 80;
        hit = px > b.x - pad && px < b.x + b.w + pad && py > b.y - pad && py < b.y + b.h + pad;
      }
      onRelease(hit);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  /* ---------------- \u573a\u666f\u5207\u6362 ---------------- */
  /*
    \u6bcf\u6b21\u91cd\u7ed8\u90fd\u4f1a\u6362\u4e00\u4e2a\u65b0\u7684 gen \u53f7\u3002\u5ef6\u65f6\u56de\u8c03\u53ea\u5728\u81ea\u5df1\u90a3\u4e00\u4ee3\u8fd8\u5728\u53f0\u4e0a\u65f6\u624d\u6267\u884c\uff0c
    \u8fd9\u6837\u6309\u4e3b\u9875\u952e\u6216\u63d0\u524d\u8df3\u8fc7\u65f6\uff0c\u65e7\u573a\u666f\u7684\u5b9a\u65f6\u5668\u4e0d\u4f1a\u7a81\u7136\u628a\u73a9\u5bb6\u62fd\u8d70\u3002
  */
  let gen = 0;
  const later = (fn, ms) => { const g = gen; setTimeout(() => { if (g === gen) fn(); }, ms); };
  const isCurrent = g => g === gen;

  function paint(cls, html, after) {
    gen++;
    sceneEl.classList.add('fade');
    busy = true;
    setTimeout(() => {
      sceneEl.className = 'scene fade ' + cls;
      sceneEl.innerHTML = html;
      void sceneEl.offsetWidth;
      sceneEl.classList.remove('fade');
      busy = false;
      if (after) after();
    }, 150);
  }

  const $ = sel => sceneEl.querySelector(sel);
  const on = (sel, fn) => {
    const el = $(sel);
    if (el) el.addEventListener('click', e => { if (!busy) { Sound.tap(); fn(e); } });
    return el;
  };

  function updateStars() { starCountEl.textContent = S.stars; }

  /* ================================================================
     1. \u9996\u9875
  ================================================================ */
  function renderTitle() {
    S.phase = 'title';
    const steps = [
      [Art.customer('birdie'), t('how1')],
      [Art.basket(), t('how2')],
      [Art.appliance('pot'), t('how3')],
      [Art.dish('smoothie'), t('how4')]
    ];
    paint('sc-title', `
      <div class="bg">${Art.street()}</div>
      <div class="layer">
        <div class="pos truck-title">${Art.truck()}</div>
        <div class="pos chef-title bob">${Art.chef('cheer')}</div>
        <div class="card title-card">
          <h1>${t('gameTitle')}</h1>
          <p class="sub">${t('gameSub')}</p>
          <button class="big-btn" id="play">${t('play')}</button>
          <div class="how">
            ${steps.map(([art, label], i) => `
              <div class="how-item"><div class="how-art">${art}</div>
                <span><b>${i + 1}</b>${label}</span></div>`).join('')}
          </div>
        </div>
      </div>
    `, () => {
      on('#play', () => { S.level = 0; startLevel(); });
    });
  }

  /* ================================================================
     2. \u63a5\u5355
  ================================================================ */
  function startLevel() {
    const L = level();
    S.forage = {
      picked: 0,
      items: buildForageItems(L)
    };
    S.cook = { stepIndex: 0, shelf: shuffle([...L.steps, ...L.shelfExtra]), taps: 0, cooked: false };
    S.serve = { served: false };
    renderOrder();
  }

  function buildForageItems(L) {
    const spots = shuffle(FORAGE_SPOTS).slice(0, L.count + 3);
    const ids = [...Array(L.count).fill(L.target),
                 ...Array(3).fill(0).map((_, i) => L.decoys[i % L.decoys.length])];
    return shuffle(ids).map((id, i) => ({
      id,
      x: spots[i][0],
      y: spots[i][1],
      rot: Math.round(Math.random() * 40 - 20),
      sc: 0.9 + Math.random() * 0.25,
      delay: (i * 0.17).toFixed(2),
      taken: false
    }));
  }

  function renderOrder() {
    S.phase = 'order';
    const L = level();
    paint('sc-order', `
      <div class="bg">${Art.street()}</div>
      <div class="layer">
        <div class="pos truck-side">${Art.truck()}</div>
        <div class="pos chef-side bob">${Art.chef('idle', [0.6, 0.1])}</div>
        <div class="pos cust-order walk-in bob">${Art.customer(L.customer, false, [-0.6, 0.1])}</div>
        <div class="bubble pop-in">
          <div class="bubble-dish">${Art.dish(L.id)}</div>
          <p>${t('customerLine', { dish: I18N.name(L.dish) })}</p>
        </div>
        <div class="chip">${t('needTitle', { dish: I18N.name(L.dish) })}</div>
        <button class="big-btn under-bubble" id="accept">${t('orderBtn')}</button>
      </div>
    `, () => {
      later(() => Sound.pick(2), 500);
      on('#accept', renderDrive);
    });
  }

  /* ================================================================
     3. \u5f00\u8f66\u53bb\u91c7\u96c6
  ================================================================ */
  function renderDrive() {
    S.phase = 'drive';
    const L = level();
    paint('sc-drive', `
      <div class="bg road-scroll">${Art.road()}${Art.road()}</div>
      <div class="layer">
        <div class="pos drive-truck">${Art.truck()}
          <div class="puff p1"></div><div class="puff p2"></div>
        </div>
        <div class="banner">${t('driveTitle', { place: I18N.place(L.place), ing: I18N.ing(L.target) })}</div>
        <div class="chip bottom-chip">${t('driving')}</div>
      </div>
    `, () => {
      Sound.engine();
      const myGen = gen;
      /* \u5230\u70b9\u81ea\u52a8\u5f00\u5230\uff0c\u6216\u8005\u4e2d\u9014\u70b9\u4e00\u4e0b\u76f4\u63a5\u8df3\u8fc7 */
      const go = () => {
        sceneEl.removeEventListener('click', go);
        if (isCurrent(myGen)) renderForage();
      };
      later(go, 2400);
      sceneEl.addEventListener('click', go);
    });
  }

  /* ================================================================
     4. \u91c7\u96c6\u98df\u6750
  ================================================================ */
  function renderForage() {
    S.phase = 'forage';
    const L = level();
    const F = S.forage;
    const done = F.picked >= L.count;

    const foreground = L.place === 'jungle'
      ? Art.svg(
          Art.leaf(-60, -30, 35, 1.5, '#173d2b') +
          Art.leaf(1320, 60, 168, 1.4, '#173d2b') +
          Art.leaf(-30, 780, -48, 1.5, '#1f4a34') +
          Art.leaf(1300, 700, 205, 1.3, '#1f4a34'),
          '0 0 1280 720', 'art-bg')
      : '';

    paint('sc-forage', `
      <div class="bg">${Art.backdrop(L.place)}</div>
      <div class="layer">
        ${F.items.map((it, i) => it.taken ? '' : `
          <button class="forage-item sway" data-i="${i}"
            style="left:${it.x}px;top:${it.y}px;--rot:${it.rot}deg;--sc:${it.sc};animation-delay:${it.delay}s">
            ${Art.ingredient(it.id)}
          </button>`).join('')}
        <div class="fg">${foreground}</div>
        <div class="banner">${t('forageTitle', { count: L.count, ing: I18N.ing(L.target) })}</div>
        <div class="basket-hud">
          <div class="basket-art">${Art.basket()}</div>
          <div class="slots">
            ${Array.from({ length: L.count }, (_, i) =>
              `<span class="slot ${i < F.picked ? 'full' : ''}">${i < F.picked ? Art.ingredient(L.target) : ''}</span>`).join('')}
          </div>
          <div class="count">${F.picked}<em>/${L.count}</em></div>
        </div>
        ${done ? `
          <div class="pos chef-forage pop-in bob">${Art.chef('cheer')}</div>
          <button class="big-btn bottom" id="toCook">${t('backBtn')}</button>` : ''}
      </div>
    `, () => {
      const basketEl = $('.basket-art');
      sceneEl.querySelectorAll('.forage-item').forEach(btn => {
        btn.addEventListener('click', () => {
          if (busy) return;
          const it = F.items[+btn.dataset.i];
          if (it.taken) return;
          if (it.id !== L.target) {
            shake(btn);
            Sound.oops();
            toast(t('forageOops', { ing: I18N.ing(L.target) }), 'warn');
            return;
          }
          it.taken = true;
          F.picked++;
          const slotIndex = F.picked - 1;   // \u8bb0\u4f4f\u81ea\u5df1\u7684\u683c\u5b50\uff0c\u591a\u4e2a\u98df\u6750\u540c\u65f6\u5728\u98de\u4e5f\u4e0d\u4f1a\u586b\u9519
          Sound.pick(slotIndex);
          btn.style.pointerEvents = 'none';
          burst(btn, 8);
          flyItem(Art.ingredient(it.id), btn, basketEl, {
            onDone: () => {
              const slots = sceneEl.querySelectorAll('.slot');
              const slot = slots[slotIndex];
              if (slot) { slot.innerHTML = Art.ingredient(L.target); slot.classList.add('full'); }
              const c = $('.basket-hud .count');
              if (c) c.innerHTML = `${F.picked}<em>/${L.count}</em>`;
              if (basketEl) { basketEl.classList.remove('nudge'); void basketEl.offsetWidth; basketEl.classList.add('nudge'); }
              if (slotIndex === L.count - 1) {      // \u6700\u540e\u4e00\u4e2a\u843d\u8fdb\u7bee\u5b50\u624d\u7b97\u9f50
                toast(t('forageDone'), 'good');
                Sound.ding();
                later(renderForage, 700);
              }
            }
          });
          btn.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.4)' }],
            { duration: 220, fill: 'forwards' });
        });
      });
      on('#toCook', renderCook);
    });
  }

  /* ================================================================
     5. \u4e0b\u53a8
  ================================================================ */
  function renderCook() {
    S.phase = 'cook';
    const L = level();
    const C = S.cook;
    const allIn = C.stepIndex >= L.steps.length;
    const done = C.cooked;

    const banner = done ? t('dishReady', { dish: I18N.name(L.dish) })
                 : allIn ? t('cookNow')
                 : t('nextIng', { ing: I18N.ing(L.steps[C.stepIndex]) });

    const controls = done ? `
        <div class="pos dish-pop">${Art.dish(L.id)}</div>
        <button class="big-btn bottom" id="serveBtn">${t('serveBtn')}</button>`
      : allIn ? `
        <div class="cook-controls">
          <button class="big-btn" id="cookBtn">${t('cookBtn')[L.appliance]}</button>
          <div class="progress"><i id="prog" style="width:${(C.taps / L.taps) * 100}%"></i></div>
          <p class="hint">${t('cookHint')}</p>
        </div>`
      : `
        <div class="shelf">
          ${C.shelf.map(id => {
            const used = L.steps.indexOf(id) > -1 && L.steps.indexOf(id) < C.stepIndex;
            return `<button class="ing-tile ${used ? 'used' : ''}" data-id="${id}" ${used ? 'disabled' : ''}>
                      ${Art.ingredient(id)}<span>${I18N.ing(id)}</span>
                    </button>`;
          }).join('')}
        </div>`;

    paint('sc-cook', `
      <div class="bg">${Art.kitchen()}</div>
      <div class="layer">
        <div class="card recipe-card">
          <h3>${t('recipeTitle', { dish: I18N.name(L.dish) })}</h3>
          <ol>
            ${L.steps.map((id, i) => `
              <li class="${i < C.stepIndex ? 'done' : ''} ${i === C.stepIndex ? 'now' : ''}">
                <b class="num">${i + 1}</b>
                <span class="ing">${Art.ingredient(id)}</span>
                <span class="nm">${I18N.ing(id)}</span>
                <span class="tick">\u2713</span>
              </li>`).join('')}
          </ol>
        </div>

        <div class="pos appliance-wrap ${allIn ? 'ready' : ''}" id="appliance">
          ${Art.appliance(L.appliance)}
          <div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div>
        </div>
        <div class="pos chef-cook bob">${Art.chef('cook', [0.5, 0.2])}</div>

        <div class="banner">${banner}</div>
        ${controls}
      </div>
    `, () => {
      const appl = $('#appliance');

      sceneEl.querySelectorAll('.ing-tile').forEach(tile => {
        if (tile.disabled) return;
        draggable(tile, {
          targetEl: () => appl,
          onRelease: hit => {
            if (!hit) return;
            const id = tile.dataset.id;
            const need = L.steps[C.stepIndex];
            if (id !== need) {
              shake(tile);
              Sound.oops();
              toast(t('wrongIng', { n: C.stepIndex + 1 }), 'warn');
              return;
            }
            C.stepIndex++;
            tile.disabled = true;
            tile.classList.add('used');
            flyItem(Art.ingredient(id), tile, appl, {
              endScale: 0.3,
              dur: 420,
              onDone: () => {
                Sound.plop();
                appl.classList.remove('bump'); void appl.offsetWidth; appl.classList.add('bump');
                burst(appl, 8, ['#fff6e6', '#ffd23f']);
                /*
                  \u4e2d\u95f4\u6b65\u9aa4\u5c31\u5730\u66f4\u65b0\u98df\u8c31\u5361\u548c\u6a2a\u5e45\uff0c\u4e0d\u6574\u5c4f\u91cd\u7ed8 \u2014\u2014
                  \u91cd\u7ed8\u90a3 ~0.5 \u79d2\u91cc\u70b9\u51fb\u4f1a\u88ab\u541e\u6389\uff0c\u5c0f\u670b\u53cb\u8fde\u70b9\u65f6\u624b\u611f\u5f88\u5dee\u3002
                */
                if (C.stepIndex >= L.steps.length) {
                  later(renderCook, 200);          // \u98df\u6750\u9f50\u4e86\uff0c\u6362\u6210"\u5f00\u706b"\u9762\u677f
                  return;
                }
                sceneEl.querySelectorAll('.recipe-card li').forEach((li, i) => {
                  li.classList.toggle('done', i < C.stepIndex);
                  li.classList.toggle('now', i === C.stepIndex);
                });
                const bn = $('.banner');
                if (bn) bn.textContent = t('nextIng', { ing: I18N.ing(L.steps[C.stepIndex]) });
              }
            });
          }
        });
      });

      on('#cookBtn', () => {
        if (C.cooked) return;
        C.taps++;
        Sound.cookStep(C.taps);
        appl.classList.remove('bump'); void appl.offsetWidth; appl.classList.add('bump');
        const p = $('#prog');
        if (p) p.style.width = Math.min(100, (C.taps / L.taps) * 100) + '%';
        if (C.taps >= L.taps) finishCooking(appl);
      });

      on('#serveBtn', renderServe);
    });
  }

  function finishCooking(appl) {
    S.cook.cooked = true;
    busy = true;
    const controls = $('.cook-controls');
    if (controls) controls.classList.add('hide');
    burst(appl, 26);
    Sound.ding();
    later(() => { busy = false; renderCook(); }, 620);
  }

  /* ================================================================
     6. \u4e0a\u83dc
  ================================================================ */
  function renderServe() {
    S.phase = 'serve';
    const L = level();
    paint('sc-serve', `
      <div class="bg">${Art.street()}</div>
      <div class="layer">
        <div class="pos truck-side">${Art.truck()}</div>
        <div class="pos chef-side bob">${Art.chef('cook', [0.6, 0.2])}</div>
        <div class="pos cust-order bob" id="cust">${Art.customer(L.customer, false, [-0.6, 0.1])}</div>
        <div class="banner">${t('serveTitle', { dish: I18N.name(L.dish) })}</div>
        <div class="chip bottom-chip">${t('serveHint')}</div>
        <div class="pos serve-dish" id="dish">
          <div class="dish-inner float">
            <div class="plate"></div>
            ${Art.dish(L.id)}
          </div>
        </div>
      </div>
    `, () => {
      const dish = $('#dish'), cust = $('#cust');
      draggable(dish, {
        targetEl: () => cust,
        onRelease: hit => {
          if (!hit || S.serve.served) return;
          S.serve.served = true;
          busy = true;
          flyItem(dish.innerHTML, dish, cust, {
            endScale: 0.6,
            onDone: () => {
              Sound.yum();
              cust.innerHTML = Art.customer(L.customer, true, [0, 0]);
              cust.classList.add('happy');
              burst(cust, 22, ['#ef4b52', '#f38fc4', '#ffd23f']);
              const b = $('.banner');
              if (b) b.textContent = t('yum');
              later(() => { busy = false; levelClear(); }, 1200);
            }
          });
          dish.style.visibility = 'hidden';
        }
      });
    });
  }

  /* ================================================================
     7. \u8fc7\u5173 / \u901a\u5173
  ================================================================ */
  function levelClear() {
    S.stars++;
    localStorage.setItem('gulu.stars', S.stars);
    updateStars();
    Sound.fanfare();

    const last = S.level >= LEVELS.length - 1;
    const panel = document.createElement('div');
    panel.className = 'overlay';
    panel.innerHTML = `
      <div class="card panel pop-in">
        <div class="big-star">${Art.star()}</div>
        <h2>${t('levelClear', { n: S.level + 1 })}</h2>
        <p class="sub">${I18N.name(level().dish)}</p>
        <button class="big-btn" id="nextLv">${t('nextBtn')}</button>
      </div>`;
    sceneEl.appendChild(panel);
    confetti(30);
    panel.querySelector('#nextLv').addEventListener('click', () => {
      Sound.tap();
      panel.remove();
      if (last) renderFinale();
      else { S.level++; startLevel(); }
    });
  }

  function renderFinale() {
    S.phase = 'finale';
    paint('sc-finale', `
      <div class="bg">${Art.street()}</div>
      <div class="layer">
        <div class="pos truck-title">${Art.truck()}</div>
        <div class="crowd">
          ${LEVELS.map((L, i) =>
            `<div class="crowd-one bob" style="animation-delay:${i * 0.2}s">${Art.customer(L.customer, true)}</div>`).join('')}
        </div>
        <div class="pos chef-title bob">${Art.chef('cheer')}</div>
        <div class="card title-card">
          <h1>${t('allDone')}</h1>
          <p class="sub">${t('allDoneSub', { n: S.stars })}</p>
          <button class="big-btn" id="again">${t('replay')}</button>
        </div>
      </div>
    `, () => {
      Sound.fanfare();
      confetti(60);
      on('#again', () => { S.level = 0; startLevel(); });
    });
  }

  function confetti(n) {
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'particle confetti';
      p.style.left = Math.random() * W + 'px';
      p.style.top = '-20px';
      p.style.background = ['#ffd23f', '#ef4b52', '#5fbf7d', '#5aa8e8', '#8b5fe0', '#f38fc4'][i % 6];
      fxEl.appendChild(p);
      p.animate([
        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
        { transform: `translateY(${H + 80}px) translateX(${Math.random() * 200 - 100}px) rotate(${Math.random() * 900}deg)`, opacity: 0.9 }
      ], { duration: 1800 + Math.random() * 1600, delay: Math.random() * 700, easing: 'cubic-bezier(.3,.5,.6,1)' })
        .onfinish = () => p.remove();
    }
  }

  /* ---------------- \u5f53\u524d\u573a\u666f\u91cd\u7ed8\uff08\u5207\u6362\u8bed\u8a00\u65f6\u7528\uff09 ---------------- */
  function repaint() {
    ({
      title: renderTitle, order: renderOrder, drive: renderDrive, forage: renderForage,
      cook: renderCook, serve: renderServe, finale: renderFinale
    }[S.phase] || renderTitle)();
  }

  /* ---------------- HUD ---------------- */
  document.getElementById('btn-home').addEventListener('click', () => { Sound.tap(); renderTitle(); });

  const soundBtn = document.getElementById('btn-sound');
  document.body.classList.toggle('muted', !Sound.enabled);
  soundBtn.addEventListener('click', () => {
    document.body.classList.toggle('muted', !Sound.toggle());
  });

  const langBtn = document.getElementById('btn-lang');
  langBtn.textContent = I18N.lang === 'zh' ? 'EN' : '\u4e2d';
  document.documentElement.lang = I18N.lang === 'zh' ? 'zh-CN' : 'en';
  langBtn.addEventListener('click', () => {
    Sound.tap();
    const l = I18N.toggle();
    langBtn.textContent = l === 'zh' ? 'EN' : '\u4e2d';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    if (S.phase === 'serve' && S.serve && S.serve.served) return;   // \u522b\u6253\u65ad\u5403\u4e1c\u897f\u7684\u52a8\u753b
    repaint();
  });

  /* \u7b2c\u4e00\u6b21\u4ea4\u4e92\u65f6\u89e3\u9501\u97f3\u9891\uff08\u6d4f\u89c8\u5668\u7b56\u7565\uff09 */
  window.addEventListener('pointerdown', () => Sound.unlock(), { once: true });

  /* ---------------- \u542f\u52a8 ---------------- */
  fit();
  updateStars();
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  renderTitle();
})();
</script>
