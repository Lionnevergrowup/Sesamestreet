<meta charset="utf-8">
<title>&#21653;&#22108;&#30340;&#32654;&#39135;&#39184;&#36710; &#183; Gulu's Foodie Truck</title>

<style>
:root {
  --ink:   #2b2340;
  --cream: #fff6e6;
  --sun:   #ffd23f;
  --grass: #4aa86b;
  --deep:  #1f4a34;
  --grape: #8b5fe0;
  --shadow: 0 8px 0 rgba(43,35,64,.22);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #14352a;
  font-family: "Nunito", "Baloo 2", "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  user-select: none;
  touch-action: manipulation;
}

#viewport {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 40%, #2b6b4d, #14352a 70%);
}

#stage {
  position: relative;
  width: 1280px;
  height: 720px;
  flex: none;
  overflow: hidden;
  border-radius: 26px;
  background: #cfe8dd;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
  transform-origin: center center;
}

.scene { position: absolute; inset: 0; opacity: 1; transition: opacity .18s ease; }
.scene.fade { opacity: 0; }

.bg { position: absolute; inset: 0; }
.bg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.layer { position: absolute; inset: 0; }
.pos   { position: absolute; }
.pos > svg, .pos svg { width: 100%; height: auto; display: block; }

.fg { position: absolute; inset: 0; pointer-events: none; }

#fx { position: absolute; inset: 0; pointer-events: none; z-index: 60; }

#hud {
  position: absolute;
  inset: 14px 16px auto 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 50;
  pointer-events: none;
}
.hud-left, .hud-right { display: flex; gap: 10px; pointer-events: auto; }

.icon-btn {
  width: 52px; height: 52px;
  border: none; border-radius: 16px;
  background: rgba(255, 246, 230, .92);

  box-shadow: 0 4px 0 rgba(43, 35, 64, .2);

}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43, 35, 64, .2); }
.icon-btn svg { width: 26px; height: 26px; fill: currentColor; }
.icon-btn.text-btn { font-size: 18px; font-weight: 800; }

.ico-off { display: none; }
body.muted .ico-on  { display: none; }
body.muted .ico-off { display: block; }

.stars-badge {
  display: flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 20px 0 14px;

}
.stars-badge svg { width: 28px; height: 28px; fill: var(--sun); }

.big-btn {
  border: none;
  border-radius: 999px;

  font-size: 30px;
  font-weight: 900;
  font-family: inherit;

  background: linear-gradient(180deg, #ff9a3c, #f4722c);
  box-shadow: 0 8px 0 #c9541c, 0 12px 24px rgba(0, 0, 0, .18);
  cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;

}
.big-btn:hover { filter: brightness(1.05); }
.big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #c9541c; }
.big-btn.bottom {
  position: absolute; left: 50%; bottom: 34px;
  transform: translateX(-50%);
  z-index: 20;
}
.big-btn.bottom:active { transform: translateX(-50%) translateY(6px); box-shadow: 0 2px 0 #c9541c; }

.big-btn.under-bubble { position: absolute; right: 96px; top: 288px; z-index: 20; }

.banner {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);

  padding: 12px 34px;
  border-radius: 999px;
  background: rgba(255, 246, 230, .95);

}

.chip {

  background: rgba(43, 35, 64, .55);
  color: #fff6e6;
  font-size: 20px; font-weight: 700;
  z-index: 20;
}
.chip.bottom-chip { top: auto; bottom: 28px; }

.card {
  background: var(--cream);
  border-radius: 28px;
  padding: 26px 28px;
  box-shadow: 0 12px 0 rgba(43, 35, 64, .18), 0 24px 50px rgba(0, 0, 0, .2);
}

.toast {
  position: absolute; top: 96px; left: 50%; transform: translateX(-50%);

  background: #fff;
  font-size: 24px; font-weight: 800; color: var(--ink);

}

.sc-cook .toast { left: calc(50% + 100px); }

.toast.good { background: #cdf0d8; color: #1f4a34; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(.9); } }

.fly { position: absolute; transform: translate(-50%, -50%); z-index: 65; }
.fly svg { width: 100%; height: 100%; }
.particle {
  position: absolute; width: 16px; height: 16px;
  border-radius: 4px;
  transform: translate(-50%, -50%);
}
.particle.confetti { width: 14px; height: 22px; border-radius: 3px; transform: none; }

@keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
@keyframes sway  {
  0%,100% { transform: rotate(calc(var(--rot) - 5deg)) scale(var(--sc)); }
  50%     { transform: rotate(calc(var(--rot) + 5deg)) scale(var(--sc)); }
}
@keyframes popIn {
  0%   { opacity: 0; transform: scale(.5); }

}
@keyframes walkIn {
  from { opacity: 0; transform: translateX(300px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes shakeIt {
  0%,100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-10px) rotate(-5deg); }
  40% { transform: translateX(10px) rotate(5deg); }
  60% { transform: translateX(-7px) rotate(-3deg); }
  80% { transform: translateX(7px) rotate(3deg); }
}
@keyframes bumpIt {
  0%,100% { transform: scale(1) translateY(0); }
  35% { transform: scale(1.07, .93) translateY(6px); }
  70% { transform: scale(.97, 1.05) translateY(-6px); }
}
@keyframes nudgeIt { 0%,100% { transform: scale(1); } 40% { transform: scale(1.14) rotate(-6deg); } }

.bob    { animation: bob 2.6s ease-in-out infinite; }
.float  { animation: float 2.4s ease-in-out infinite; }
.pop-in { animation: popIn .45s cubic-bezier(.2,1.5,.4,1) both; }
.walk-in{ animation: walkIn .6s cubic-bezier(.2,.8,.3,1) both, bob 2.6s ease-in-out .6s infinite; }
.shake  { animation: shakeIt .45s ease; }
.bump   { animation: bumpIt .4s ease; }
.nudge  { animation: nudgeIt .35s ease; }

.truck-title { left: 10px; bottom: 22px; width: 540px; }
.chef-title  { left: 520px; bottom: 30px; width: 250px; }

.title-card { right: 46px; top: 74px; width: 470px; position: absolute; text-align: center; }
.title-card h1 { font-size: 46px; line-height: 1.15; color: var(--deep); }
.title-card .sub { margin: 10px 0 20px; font-size: 21px; font-weight: 700; color: #7a6a55; }

.how { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
.how-item { display: flex; align-items: center; gap: 10px; }

.crowd {

}

.sc-finale .chef-title { left: 908px; bottom: 16px; width: 202px; }

.truck-side { left: -30px; bottom: 34px; width: 610px; }

.dish-inner { position: relative; }

.forage-item svg { width: 100%; height: 100%; }

.basket-hud {

}
.basket-art { width: 78px; flex: none; }

.basket-rows { display: flex; flex-direction: column; gap: 8px; }

.slots { display: flex; flex-wrap: wrap; gap: 6px; max-width: 280px; }

  width: 40px; height: 40px; border-radius: 12px;

}

@keyframes driftAbout {
  0%,100% { margin-left: -59px; margin-top: -59px; }

  50%     { margin-left: -37px; margin-top: -50px; }
  75%     { margin-left: -70px; margin-top: -64px; }
}
.forage-item.drift { animation: sway 3.2s ease-in-out infinite, driftAbout 9s ease-in-out infinite; }

.chef-forage { right: 40px; bottom: 30px; width: 200px; z-index: 25; }

.recipe-card { position: absolute; left: 34px; top: 92px; width: 320px; padding: 20px 22px; }

}
.recipe-card li .num {

}

.appliance-wrap { left: 690px; bottom: 244px; width: 290px; z-index: 12; }

.appliance-wrap.ready { filter: drop-shadow(0 0 22px rgba(255, 210, 63, .8)); }

.steam {

}

.steam.s3 { margin-left: 26px; animation-delay: 1.5s; }
@keyframes steamUp {
  0%   { opacity: 0; transform: translateY(0) scale(.5); }
  35%  { opacity: .8; }
  100% { opacity: 0; transform: translateY(-90px) scale(1.5); }
}

.chef-cook { left: 400px; bottom: 232px; width: 210px; z-index: 12; }

.shelf {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
  display: flex; gap: 10px;
  padding: 16px 20px;
  border-radius: 26px;
  background: rgba(255, 246, 230, .95);
  box-shadow: var(--shadow);
  z-index: 30;
}
.ing-tile {
  width: 116px; padding: 10px 6px 8px;
  border: none; border-radius: 20px;
  background: #fff;
  box-shadow: 0 5px 0 rgba(43, 35, 64, .16);
  cursor: grab;
  display: grid; justify-items: center; gap: 2px;
  font-family: inherit;
  touch-action: none;
  transition: box-shadow .1s ease;
}
.ing-tile svg { width: 74px; height: 74px; }
.ing-tile span { font-size: 18px; font-weight: 800; color: #5c5040; }

.cook-controls {

}
.cook-controls.hide { opacity: 0; transform: translateX(-50%) translateY(30px); pointer-events: none; }

.dish-pop {

.overlay {
  position: absolute; inset: 0; z-index: 55;

  background: rgba(20, 40, 32, .55);

}
.panel { width: 460px; text-align: center; }
.panel h2 { font-size: 40px; color: var(--deep); }
.panel .sub { margin: 6px 0 22px; font-size: 24px; font-weight: 700; color: #7a6a55; }

.icon-btn:focus-visible,

@media (prefers-reduced-motion: reduce) {
  
  .bob, .float, .walk-in, .forage-item.sway, .forage-item.drift, .road-item,
  .road-scroll, .drive-truck, .puff, .dish-pop, .sort-item,

}

#rotate-hint { display: none; }
@media (orientation: portrait) and (max-width: 900px) {
  #rotate-hint {
    display: grid; place-items: center;
    position: fixed; inset: 0; z-index: 100;
    background: #1f4a34; color: var(--cream); text-align: center; padding: 30px;
  }

}

.btn-row { display: flex; gap: 10px; margin-bottom: 18px; }

.title-card .big-btn { margin-bottom: 12px; }

.layer.dim::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(20, 40, 32, .5);
}
.lv-grid {
  position: absolute; left: 50%; top: 100px; transform: translateX(-50%);
  display: grid; grid-template-columns: repeat(4, 264px); gap: 14px;
  z-index: 10;
}

  position: relative;
  height: 148px; padding: 8px 12px;
  border: none; border-radius: 22px;
  background: var(--cream);
  box-shadow: 0 6px 0 rgba(43, 35, 64, .25);
  cursor: pointer; font-family: inherit;

  transition: transform .1s ease, box-shadow .1s ease;
}
.lv-card:hover { transform: translateY(-3px); box-shadow: 0 9px 0 rgba(43, 35, 64, .25); }

<script>
/* ------------------------------------------------------------------
   store.js \u2014 \u5b58\u8fdb\u5ea6\u7528\u7684\u4e00\u5c42\u8584\u5c01\u88c5\u3002

   localStorage \u5e76\u4e0d\u662f\u968f\u65f6\u90fd\u80fd\u7528\uff1a\u9690\u79c1\u6a21\u5f0f\u3001\u5d4c\u5728 iframe \u91cc\u88ab\u9694\u79bb\u5b58\u50a8\u3001
   \u6d4f\u89c8\u5668\u5173\u6389\u4e86\u7ad9\u70b9\u6570\u636e\uff0c\u8bfb\u4e00\u4e0b\u5c31\u4f1a\u629b\u5f02\u5e38\u3002\u6e38\u620f\u4e3a\u6b64\u767d\u5c4f\u662f\u4e0d\u53ef\u63a5\u53d7\u7684 \u2014\u2014
   \u5b58\u4e0d\u4e86\u9876\u591a\u662f\u8bb0\u4e0d\u4f4f\u661f\u661f\uff0c\u4e0d\u8be5\u8fde\u73a9\u90fd\u73a9\u4e0d\u4e86\u3002
   \u6240\u4ee5\u8fd9\u91cc\u63a2\u6d4b\u4e00\u6b21\uff0c\u4e0d\u884c\u5c31\u9000\u56de\u5185\u5b58\uff0c\u672c\u6b21\u7167\u73a9\uff0c\u5237\u65b0\u540e\u5fd8\u6389\u3002
------------------------------------------------------------------ */

const Store = (() => {
  const memory = Object.create(null);
  let usable = false;

  try {
    const probe = '__gulu_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    usable = true;
  } catch (e) {
    usable = false;
  }

  return {
    get available() { return usable; },

    get(key, fallback = null) {
      try {
        const v = usable ? window.localStorage.getItem(key) : memory[key];
        return (v === null || v === undefined) ? fallback : v;
      } catch (e) {
        return fallback;
      }
    },

    set(key, value) {
      const v = String(value);
      try {
        if (usable) window.localStorage.setItem(key, v);
        else memory[key] = v;
      } catch (e) {
        memory[key] = v;      // \u6bd4\u5982\u5199\u6ee1\u4e86\u914d\u989d\uff0c\u9000\u56de\u5185\u5b58
      }
    }
  };
})();
</script>

<script>
/* ------------------------------------------------------------------
   audio.js \u2014 \u58f0\u97f3\u5168\u90e8\u7528 WebAudio \u73b0\u573a\u5408\u6210\uff0c\u4e0d\u4f9d\u8d56\u4efb\u4f55\u97f3\u9891\u6587\u4ef6\u3002
   All audio is synthesised with WebAudio \u2014 no asset files, works offline.

   \u5206\u4e24\u6761\u7ebf\uff1a
     sfx   \u2014\u2014 \u6458\u83dc\u3001\u4e0b\u9505\u3001\u8fc7\u5173\u8fd9\u4e9b\u5373\u65f6\u53cd\u9988
     music \u2014\u2014 \u4e00\u76f4\u5728\u5e95\u4e0b\u8d70\u7684\u56db\u5c0f\u8282\u5faa\u73af\uff0c\u8ba9\u753b\u9762\u4e0d\u81f3\u4e8e\u6b7b\u6c14\u6c89\u6c89
   \u4e24\u6761\u7ebf\u6c47\u5230\u4e00\u4e2a\u538b\u7f29\u5668\u518d\u51fa\u53bb\uff0c\u97f3\u91cf\u62c9\u9ad8\u4e5f\u4e0d\u4f1a\u7834\u97f3\u3002
------------------------------------------------------------------ */

const Sound = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null;
  let enabled = Store.get('gulu.sound') !== 'off';

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }

      /* \u538b\u7f29\u5668\u515c\u5e95\uff1a\u540c\u65f6\u54cd\u597d\u51e0\u4e2a\u97f3\u4e5f\u4e0d\u4f1a\u524a\u9876 */
      master = ctx.createDynamicsCompressor();
      master.threshold.value = -14;
      master.ratio.value = 12;
      master.attack.value = 0.003;
      master.release.value = 0.2;
      master.connect(ctx.destination);

      sfxBus = ctx.createGain();
      sfxBus.gain.value = 0.9;
      sfxBus.connect(master);

      musicBus = ctx.createGain();
      musicBus.gain.value = 0.34;      // \u97f3\u4e50\u8981\u57ab\u5728\u5e95\u4e0b\uff0c\u522b\u76d6\u4f4f\u97f3\u6548
      musicBus.connect(master);
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }

  /* \u4e00\u4e2a\u97f3\u7b26\u3002when \u7ed9\u7edd\u5bf9\u65f6\u95f4\uff08\u97f3\u4e50\u7528\uff09\uff0c\u4e0d\u7ed9\u5c31\u662f"\u9a6c\u4e0a"\uff08\u97f3\u6548\u7528\uff09\u3002 */
  function note(freq, {
    type = 'sine', when = null, at = 0, dur = 0.22, gain = 0.5,
    attack = 0.008, glide = 0, bus = null
  } = {}) {
    if (!enabled || !ensure()) return;
    const t = when !== null ? when : ctx.currentTime + at;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (glide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * glide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(bus || sfxBus);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* \u566a\u58f0\u8109\u51b2\uff1a\u6c99\u6c99\u58f0\u3001\u5636\u5636\u58f0\u3001\u9f13\u70b9 */
  function noise({ when = null, at = 0, dur = 0.3, gain = 0.2, freq = 1200, q = 1, bus = null } = {}) {
    if (!enabled || !ensure()) return;
    const t = when !== null ? when : ctx.currentTime + at;
    const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(g).connect(bus || sfxBus);
    src.start(t);
    src.stop(t + dur);
  }

  /* C \u5927\u8c03\u4e94\u58f0\u97f3\u9636\uff0c\u600e\u4e48\u5f39\u90fd\u597d\u542c */
  const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  const PICK  = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];

  /* ---------------- \u80cc\u666f\u97f3\u4e50 ----------------
     \u56db\u5c0f\u8282\u5faa\u73af\uff0cI\u2013vi\u2013IV\u2013V\u3002\u65cb\u5f8b\u662f\u5199\u6b7b\u7684\u4e00\u53e5\uff0c
     \u4e0d\u662f\u968f\u673a\u97f3\u7b26\uff0c\u6240\u4ee5\u542c\u591a\u4e45\u90fd\u4e0d\u4f1a\u8dd1\u8c03\u6216\u53d8\u5435\u3002 */
  const CHORDS = [
    { root: 130.81, pad: [261.63, 329.63, 392.00] },   // C
    { root: 110.00, pad: [261.63, 329.63, 440.00] },   // Am
    { root: 174.61, pad: [261.63, 349.23, 440.00] },   // F
    { root: 196.00, pad: [293.66, 392.00, 493.88] }    // G
  ];
  const MELODY = [
    [5, null, 4, null, 3, 4, 5, null],
    [4, null, 3, null, 2, 3, 4, null],
    [3, null, 4, null, 5, 4, 3, null],
    [2, 3, 4, null, 5, null, null, null]
  ];
  const BPM = 104;

  let musicTimer = null, nextTime = 0, stepIx = 0, musicWanted = false;

  function scheduleAhead() {
    if (!ctx) return;
    const eighth = (60 / BPM) / 2;
    while (nextTime < ctx.currentTime + 0.25) {
      const bar = Math.floor(stepIx / 8) % 4;
      const pos = stepIx % 8;
      const ch = CHORDS[bar];

      if (pos === 0 || pos === 4)                       // \u4f4e\u97f3
        note(ch.root, { type: 'sine', when: nextTime, dur: eighth * 1.9, gain: 0.55, bus: musicBus });
      if (pos === 0)                                    // \u548c\u5f26\u57ab
        ch.pad.forEach(f => note(f, { type: 'triangle', when: nextTime, dur: eighth * 3.4, gain: 0.13, bus: musicBus }));
      const m = MELODY[bar][pos];                       // \u65cb\u5f8b
      if (m !== null)
        note(SCALE[m], { type: 'triangle', when: nextTime, dur: eighth * 1.7, gain: 0.3, bus: musicBus });
      if (pos % 2 === 1)                                // \u8f7b\u8f7b\u7684\u8282\u62cd
        noise({ when: nextTime, dur: 0.045, gain: 0.06, freq: 6500, q: 1.6, bus: musicBus });

      nextTime += eighth;
      stepIx++;
    }
  }

  function startMusic() {
    musicWanted = true;
    if (!enabled || musicTimer || !ensure()) return;
    nextTime = ctx.currentTime + 0.12;
    scheduleAhead();
    musicTimer = setInterval(scheduleAhead, 60);
  }

  function stopMusic() {
    clearInterval(musicTimer);
    musicTimer = null;
  }

  return {
    get enabled() { return enabled; },

    toggle() {
      enabled = !enabled;
      Store.set('gulu.sound', enabled ? 'on' : 'off');
      if (enabled) { ensure(); this.tap(); if (musicWanted) startMusic(); }
      else stopMusic();
      return enabled;
    },

    /* \u6d4f\u89c8\u5668\u8981\u6c42\u9996\u6b21\u4ea4\u4e92\u540e\u624d\u80fd\u51fa\u58f0 */
    unlock() { ensure(); startMusic(); },

    /* \u58f0\u97f3\u662f\u4e0d\u662f\u771f\u7684\u8dd1\u8d77\u6765\u4e86 \u2014\u2014 \u89e3\u9501\u90a3\u8fb9\u9760\u8fd9\u4e2a\u5224\u65ad\u8981\u4e0d\u8981\u518d\u8bd5 */
    get running() { return !!ctx && ctx.state === 'running'; },

    music(on) { on ? startMusic() : (musicWanted = false, stopMusic()); },

    tap() {
      note(660, { type: 'triangle', dur: 0.1, gain: 0.5 });
      note(990, { type: 'sine', at: 0.02, dur: 0.08, gain: 0.2 });
    },

    /* \u6458\u5230\u4e00\u4e2a\uff0c\u97f3\u9ad8\u968f\u7bee\u5b50\u91cc\u7684\u6570\u91cf\u5f80\u4e0a\u8d70 */
    pick(index = 0) {
      const f = PICK[Math.min(index, PICK.length - 1)];
      note(f, { type: 'triangle', dur: 0.2, gain: 0.6 });
      note(f * 2, { type: 'sine', at: 0.02, dur: 0.16, gain: 0.24 });
      noise({ dur: 0.09, gain: 0.12, freq: 3200, q: 2 });
    },

    /* \u6458\u9519\u4e86 \u2014\u2014 \u4e0d\u523a\u8033\uff0c\u53ea\u662f"\u54a6\uff1f" */
    oops() {
      note(330, { type: 'sine', dur: 0.18, gain: 0.5, glide: 0.75 });
      note(247, { type: 'sine', at: 0.11, dur: 0.2, gain: 0.36 });
    },

    whoosh() { noise({ dur: 0.26, gain: 0.16, freq: 900, q: 0.7 }); },

    /* \u98df\u6750\u6389\u8fdb\u9505\u91cc */
    plop() {
      note(430, { type: 'sine', dur: 0.18, gain: 0.62, glide: 0.5 });
      noise({ at: 0.02, dur: 0.13, gain: 0.14, freq: 520 });
    },

    /* \u6405\u62cc / \u714e / \u70e4 \u7684\u5faa\u73af\u58f0 */
    cookStep(i = 0) {
      noise({ dur: 0.17, gain: 0.2, freq: 700 + i * 130, q: 2 });
      note(180 + i * 26, { type: 'sawtooth', dur: 0.15, gain: 0.2 });
    },

    /* \u83dc\u505a\u597d\u4e86 */
    ding() {
      note(1046.5, { type: 'sine', dur: 0.55, gain: 0.6 });
      note(1567.98, { type: 'sine', at: 0.06, dur: 0.5, gain: 0.3 });
      note(2093, { type: 'sine', at: 0.12, dur: 0.4, gain: 0.14 });
    },

    /* \u987e\u5ba2\u5403\u5f97\u5f88\u5f00\u5fc3 */
    yum() {
      [392, 523.25, 659.25].forEach((f, i) =>
        note(f, { type: 'triangle', at: i * 0.12, dur: 0.24, gain: 0.55 }));
      note(783.99, { at: 0.36, dur: 0.4, gain: 0.4, type: 'sine' });
    },

    /* \u8fc7\u5173\u5c0f\u53f7\u89d2 */
    fanfare() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        note(f, { type: 'triangle', at: i * 0.11, dur: 0.32, gain: 0.6 });
        note(f * 1.5, { type: 'sine', at: i * 0.11 + 0.01, dur: 0.28, gain: 0.22 });
      });
      note(1046.5, { type: 'triangle', at: 0.5, dur: 0.7, gain: 0.6 });
      note(1567.98, { type: 'sine', at: 0.5, dur: 0.7, gain: 0.28 });
    },

    /* \u9910\u8f66\u5f15\u64ce */
    engine() {
      note(92, { type: 'sawtooth', dur: 0.95, gain: 0.22, glide: 1.25 });
      noise({ dur: 0.95, gain: 0.1, freq: 320, q: 0.6 });
      note(520, { type: 'square', at: 0.05, dur: 0.13, gain: 0.3 });
      note(660, { type: 'square', at: 0.2, dur: 0.15, gain: 0.3 });
    }
  };
})();
</script>

<script>
/* ------------------------------------------------------------------
   art.js \u2014 \u5168\u90e8\u7f8e\u672f\u90fd\u662f\u8fd9\u91cc\u73b0\u753b\u7684\u539f\u521b SVG\uff0c\u6ca1\u6709\u4efb\u4f55\u5916\u90e8\u56fe\u7247\u3002
   Every visual is original SVG generated here \u2014 no image assets,
   no third-party characters.
------------------------------------------------------------------ */

const Art = (() => {

  /* ---------- \u901a\u7528\u5c0f\u5de5\u5177 / helpers ---------- */

  const svg = (inner, vb = '0 0 100 100', cls = '') =>
    `<svg class="${cls}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

  /* \u6bdb\u8338\u8338\u7684\u8f6e\u5ed3\uff1a\u6cbf\u692d\u5706\u4e00\u5708\u753b\u5916\u51f8\u7684\u5c0f\u5706\u5f27 */
  function furPath(cx, cy, rx, ry, n = 22) {
    const pt = i => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry];
    };
    let [x0, y0] = pt(0);
    let d = `M${x0.toFixed(1)} ${y0.toFixed(1)}`;
    for (let i = 1; i <= n; i++) {
      const [x, y] = pt(i), [px, py] = pt(i - 1);
      const r = (Math.hypot(x - px, y - py) / 2) * 1.18;
      d += `A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return d + 'Z';
  }

  /* \u4e00\u53cc\u4f1a\u770b\u4eba\u7684\u5927\u773c\u775b */
  function eyes(cx, cy, r, gap, look = [0, 0], happy = false) {
    const [lx, ly] = look;
    const one = ex => happy
      ? `<path d="M${ex - r} ${cy} q${r} ${-r * 1.1} ${r * 2} 0" fill="none"
           stroke="#2b2340" stroke-width="${r * 0.42}" stroke-linecap="round"/>`
      : `<circle cx="${ex}" cy="${cy}" r="${r}" fill="#fffdf7"/>
         <circle cx="${ex}" cy="${cy}" r="${r}" fill="none" stroke="#2b2340" stroke-width="2" opacity=".18"/>
         <circle cx="${ex + lx * r * 0.34}" cy="${cy + ly * r * 0.34}" r="${r * 0.46}" fill="#2b2340"/>
         <circle cx="${ex + lx * r * 0.34 - r * 0.16}" cy="${cy + ly * r * 0.34 - r * 0.18}" r="${r * 0.16}" fill="#fff"/>`;
    return one(cx - gap / 2) + one(cx + gap / 2);
  }

  /* \u4e00\u7247\u53f6\u5b50\uff08\u4e1b\u6797\u80cc\u666f\u7528\uff09 */
  const leaf = (x, y, rot, s, fill, vein = 'rgba(255,255,255,.22)') => `

  function creation(color, appliance, toppings = []) {
    const dark = shade(color, -0.22), light = shade(color, 0.2);
    const bits = toppings.slice(0, 3).map((id, i) => `

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const ch = i => {
      const v = (n >> (16 - i * 8)) & 255;
      return Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt))));
    };
    return '#' + [0, 1, 2].map(i => ch(i).toString(16).padStart(2, '0')).join('');
  }

  function blend(ids) {
    if (!ids.length) return '#e8e2d4';
    let r = 0, g = 0, b = 0;
    ids.forEach(id => {
      const n = parseInt((ING_COLOR[id] || '#cccccc').slice(1), 16);
      r += (n >> 16) & 255; g += (n >> 8) & 255; b += n & 255;
    });
    const k = ids.length;
    return '#' + [r / k, g / k, b / k].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');

  /* ---------- \u80cc\u666f / backdrops ---------- */

  function backdrop(place) {
    const W = 1280, H = 720;

    if (place === 'jungle') {
      /* \u4ece\u9876\u4e0a\u5782\u4e0b\u6765\u7684\u85e4\u8513 */

    if (place === 'farm') {

  /*

    \u6240\u4ee5\u91cc\u9762\u7684\u4e1c\u897f\u90fd\u8981\u80fd\u9996\u5c3e\u63a5\u5f97\u4e0a\uff1a\u8def\u9762\u865a\u7ebf\u5747\u5300\u5206\u5e03\uff0c\u4e91\u548c\u6811\u5404\u6765\u4e00\u7ec4\u3002

  function road() {
    const bush = (x, y, s) => `

<script>
/* ------------------------------------------------------------------
   game.js \u2014 \u573a\u666f\u72b6\u6001\u673a\u4e0e\u4ea4\u4e92
   Scene state machine: title \u2192 order \u2192 drive \u2192 forage \u2192 cook \u2192 serve
------------------------------------------------------------------ */

(() => {
  const stage = document.getElementById('stage');
  const sceneEl = document.getElementById('scene');
  const fxEl = document.getElementById('fx');
  const starCountEl = document.getElementById('star-count');
  const W = 1280, H = 720;
  let scale = 1;
  let busy = false;               // \u573a\u666f\u5207\u6362\u4e2d\uff0c\u5c4f\u853d\u8f93\u5165
  const t = (k, v) => I18N.t(k, v);

  /* ---------------- \u6e38\u620f\u72b6\u6001 ---------------- */
  const S = {
    phase: 'title',
    level: 0,
    stars: +(Store.get('gulu.stars') || 0),
    forage: null,
    cook: null,
    serve: null,
    drive: null,
    mem: null,
    sort: null
  };

  const level = () => LEVELS[S.level];

  /*
    \u54ea\u4e9b\u5173\u901a\u8fc7\u4e86\uff0c\u5355\u72ec\u5b58\u4e00\u4efd \u2014\u2014 \u6709\u4e86\u5b83\u624d\u80fd\u505a\u9009\u5173\uff0c
    \u5c0f\u670b\u53cb\u60f3\u73a9\u54ea\u4e00\u5173\u5c31\u73a9\u54ea\u4e00\u5173\uff0c\u4e0d\u7528\u6bcf\u6b21\u4ece\u7b2c\u4e00\u5173\u91cd\u6253\u3002
  */
  const doneSet = () => new Set((Store.get('gulu.done') || '').split(',').filter(Boolean));
  const markDone = id => {
    const d = doneSet(); d.add(id);
    Store.set('gulu.done', [...d].join(','));
  };
  /* \u7b2c\u4e00\u4e2a\u8fd8\u6ca1\u901a\u7684\u5173\uff0c"\u5f00\u59cb\u95ef\u5173"\u4ece\u8fd9\u91cc\u63a5\u7740\u73a9 */
  function firstUndone() {
    const d = doneSet();
    const i = LEVELS.findIndex(L => !d.has(L.id));
    return i < 0 ? 0 : i;
  }

  /* ---------------- \u821e\u53f0\u7f29\u653e ---------------- */
  function fit() {
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 120));

  /* ---------------- \u5c0f\u5de5\u5177 ---------------- */

  const shuffle = a => {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  /* \u5143\u7d20\u5728\u821e\u53f0\u5750\u6807\u7cfb\u91cc\u7684\u4f4d\u7f6e */
  function box(el) {
    const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
    const x = (r.left - s.left) / scale, y = (r.top - s.top) / scale;
    const w = r.width / scale, h = r.height / scale;
    return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
  }

  /* \u8ba9\u4e00\u4e2a\u4e1c\u897f\u4ece A \u98de\u5230 B\uff08\u5e26\u4e00\u70b9\u629b\u7269\u7ebf\uff09 */
  function flyItem(html, fromEl, toEl, opts = {}) {
    if (!fromEl || !toEl) { opts.onDone && opts.onDone(); return; }
    const a = box(fromEl), b = box(toEl);
    const el = document.createElement('div');
    el.className = 'fly';
    el.innerHTML = html;
    el.style.left = a.cx + 'px';
    el.style.top = a.cy + 'px';
    el.style.width = a.w + 'px';
    el.style.height = a.h + 'px';
    fxEl.appendChild(el);
    Sound.whoosh();
    const dx = b.cx - a.cx, dy = b.cy - a.cy;
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
      { transform: `translate(-50%,-50%) translate(${dx * 0.5}px,${dy * 0.5 - 110}px) scale(1.2) rotate(12deg)`, opacity: 1, offset: 0.55 },
      { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${opts.endScale ?? 0.45})`, opacity: 0.85 }
    ], { duration: opts.dur ?? 520, easing: 'cubic-bezier(.35,.05,.3,1)' });
    anim.onfinish = () => { el.remove(); opts.onDone && opts.onDone(); };
  }

  /* \u5f69\u8272\u5c0f\u788e\u7247\u7206\u5f00 */
  function burst(el, n = 14, colors = ['#ffd23f', '#ef4b52', '#5fbf7d', '#5aa8e8', '#8b5fe0']) {
    if (!el) return;
    const b = box(el);
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'particle';
      p.style.left = b.cx + 'px';
      p.style.top = b.cy + 'px';
      p.style.background = colors[i % colors.length];
      if (i % 3 === 0) p.style.borderRadius = '50%';
      fxEl.appendChild(p);
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.6;
      const d = 90 + Math.random() * 140;
      p.animate([
        { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 60}px) scale(.3) rotate(${Math.random() * 540 - 270}deg)`, opacity: 0 }
      ], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.2,.6,.4,1)' })
        .onfinish = () => p.remove();
    }
  }

  /* \u9876\u90e8\u98d8\u4e00\u53e5\u63d0\u793a */
  let toastTimer = null;
  function toast(text, kind = '') {
    const old = fxEl.querySelector('.toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = text;
    fxEl.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 1900);
  }

  function shake(el) {
    if (!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  /* \u62d6\u62fd\uff08\u4e5f\u652f\u6301\u76f4\u63a5\u70b9\u4e00\u4e0b\uff09\u2014\u2014\u5bf9\u5c0f\u670b\u53cb\u6765\u8bf4\u547d\u4e2d\u5224\u5b9a\u653e\u5bbd 80px */
  function draggable(el, { targetEl, onRelease }) {
    let sx = 0, sy = 0, moved = false, active = false;
    el.addEventListener('pointerdown', e => {
      if (busy) return;
      active = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      el.setPointerCapture(e.pointerId);
      el.classList.add('grabbing');
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!active) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 10) moved = true;
      if (moved) el.style.transform = `translate(${dx / scale}px,${dy / scale}px) scale(1.12)`;
    });
    /* \u624b\u52bf\u88ab\u7cfb\u7edf\u62a2\u8d70\uff08\u6765\u7535\u3001\u591a\u6307\u3001\u8fb9\u7f18\u6ed1\u52a8\uff09\u5c31\u5f53\u6ca1\u62d6\u8fc7\uff0c\u522b\u8bef\u5224\u6210\u653e\u4e0b */
    el.addEventListener('pointercancel', () => {
      if (!active) return;
      active = false;
      el.classList.remove('grabbing');
      el.style.transform = '';
    });

    const end = e => {
      if (!active) return;
      active = false;
      el.classList.remove('grabbing');
      el.style.transform = '';
      let hit = !moved;                       // \u76f4\u63a5\u70b9\u4e00\u4e0b = \u547d\u4e2d
      const target = typeof targetEl === 'function' ? targetEl() : targetEl;
      if (moved && target) {
        const s = stage.getBoundingClientRect();
        const px = (e.clientX - s.left) / scale, py = (e.clientY - s.top) / scale;
        const b = box(target), pad = 80;
        hit = px > b.x - pad && px < b.x + b.w + pad && py > b.y - pad && py < b.y + b.h + pad;
      }
      onRelease(hit);
    };
    el.addEventListener('pointerup', end);
  }

  /* ---------------- \u573a\u666f\u5207\u6362 ---------------- */
  /*
    \u6bcf\u6b21\u91cd\u7ed8\u90fd\u4f1a\u6362\u4e00\u4e2a\u65b0\u7684 gen \u53f7\u3002\u5ef6\u65f6\u56de\u8c03\u53ea\u5728\u81ea\u5df1\u90a3\u4e00\u4ee3\u8fd8\u5728\u53f0\u4e0a\u65f6\u624d\u6267\u884c\uff0c
    \u8fd9\u6837\u6309\u4e3b\u9875\u952e\u6216\u63d0\u524d\u8df3\u8fc7\u65f6\uff0c\u65e7\u573a\u666f\u7684\u5b9a\u65f6\u5668\u4e0d\u4f1a\u7a81\u7136\u628a\u73a9\u5bb6\u62fd\u8d70\u3002
  */
  let gen = 0;
  const later = (fn, ms) => { const g = gen; setTimeout(() => { if (g === gen) fn(); }, ms); };
  const isCurrent = g => g === gen;

  function paint(cls, html, after) {
    gen++;
    /*
      \u4e0a\u4e2a\u573a\u666f\u7684\u63d0\u793a\u548c\u788e\u7247\u4e0d\u8be5\u98d8\u5230\u4e0b\u4e00\u4e2a\u573a\u666f\u91cc \u2014\u2014
      \u6bd4\u5982"\u8fd9\u4e0d\u662f\u9999\u8549\u5440"\u4f1a\u4e00\u8def\u98d8\u5230\u53a8\u623f\u3002
      \u53ea\u6e05\u7eaf\u88c5\u9970\u7684\u90e8\u5206\uff1b\u98de\u884c\u4e2d\u7684\u98df\u6750\u5e26\u7740\u56de\u8c03\uff0c\u8ba9\u5b83\u81ea\u5df1\u98de\u5b8c\u3002
    */
    clearTimeout(toastTimer);
    fxEl.querySelectorAll('.toast, .particle').forEach(el => el.remove());
    sceneEl.classList.add('fade');
    busy = true;
    setTimeout(() => {
      sceneEl.className = 'scene fade ' + cls;
      sceneEl.innerHTML = html;
      void sceneEl.offsetWidth;
      sceneEl.classList.remove('fade');
      busy = false;
      if (after) after();
    }, 150);
  }

  const $ = sel => sceneEl.querySelector(sel);
  const on = (sel, fn) => {
    const el = $(sel);
    if (el) el.addEventListener('click', e => { if (!busy) { Sound.tap(); fn(e); } });
    return el;
  };

  function updateStars() { starCountEl.textContent = S.stars; }

  /* ================================================================
     1b. \u9009\u5173 \u2014\u2014 12 \u5173\u4efb\u9009\uff0c\u4e0d\u5fc5\u6309\u987a\u5e8f
  ================================================================ */
  function renderLevelSelect() {

  /* ================================================================
     2. \u63a5\u5355
  ================================================================ */
  function startLevel() {
    const L = level();
    S.forage = {
      /* \u6bcf\u79cd\u76ee\u6807\u5404\u8bb0\u4e00\u4e2a\u6570 \u2014\u2014 \u540e\u9762\u7684\u5173\u5361\u8981\u540c\u65f6\u6570\u4e24\u6837\u4e1c\u897f */
      picked: L.targets.map(() => 0),
      items: buildForageItems(L)
    };
    S.cook = { stepIndex: 0, shelf: shuffle([...L.steps, ...L.shelfExtra]), taps: 0, cooked: false };
    S.serve = { served: false };
    renderOrder();
  }

  /* \u8fd9\u4e00\u5173\u7684\u91c7\u96c6\u6709\u6ca1\u6709\u5168\u90e8\u5b8c\u6210 */
  const forageDone = () => level().targets.every((t, i) => S.forage.picked[i] >= t.count);

  function buildForageItems(L) {
    const ids = [];
    L.targets.forEach(t => { for (let i = 0; i < t.count; i++) ids.push(t.id); });
    L.decoys.forEach((d, i) => { ids.push(d); if (i === 0) ids.push(d); });   // 3 \u4e2a\u5e72\u6270\u7269
    const spots = shuffle(FORAGE_SPOTS).slice(0, ids.length);
    return shuffle(ids).map((id, i) => ({
      id,
      x: spots[i][0],
      y: spots[i][1],
      rot: Math.round(Math.random() * 40 - 20),
      sc: 0.9 + Math.random() * 0.25,
      delay: (i * 0.13).toFixed(2),
      taken: false
    }));
  }

  function renderOrder() {
    S.phase = 'order';
    const L = level();
    paint('sc-order', `
      <div class="bg">${Art.street()}</div>
      <div class="layer">
        <div class="pos truck-side">${Art.truck()}</div>
        <div class="pos chef-side bob">${Art.chef('idle', [0.6, 0.1])}</div>
        <div class="pos cust-order walk-in bob">${Art.customer(L.customer, false, [-0.6, 0.1])}</div>
        <div class="bubble pop-in">
          <div class="bubble-dish">${Art.dish(L.id)}</div>
          <p>${t('customerLine', { dish: I18N.name(L.dish) })}</p>
        </div>
        <div class="chip">${t('needTitle', { dish: I18N.name(L.dish) })}</div>
        <button class="big-btn under-bubble" id="accept">${t('orderBtn')}</button>
      </div>
    `, () => {
      later(() => Sound.pick(2), 500);
      on('#accept', renderDrive);
    });
  }

  /* ================================================================
     3. \u5f00\u8f66\u53bb\u91c7\u96c6
  ================================================================ */
  function renderDrive() {
    S.phase = 'drive';
    const L = level();
    /*
      \u4ee5\u524d\u8fd9\u91cc\u662f\u5e72\u7b49 2.4 \u79d2\u7684\u8fc7\u573a\u52a8\u753b\u3002
      \u73b0\u5728\u8def\u4e0a\u4f1a\u98d8\u6765\u6c34\u679c\u548c\u661f\u661f\uff0c\u70b9\u5230\u5c31\u6536\u8fdb\u515c\u91cc \u2014\u2014
      \u6574\u5c40\u6e38\u620f\u7684\u64cd\u4f5c\u539f\u672c\u5168\u662f"\u770b\u51c6\u4e86\u70b9"\uff0c\u8fd9\u4e00\u6bb5\u52a0\u4e86\u70b9\u624b\u5feb\u7684\u6210\u5206\uff0c\u6362\u6362\u53e3\u5473\u3002
      \u6536\u591a\u5c11\u90fd\u4e0d\u5f71\u54cd\u8fc7\u5173\uff0c\u7eaf\u5c5e\u597d\u73a9\uff0c\u6240\u4ee5\u6361\u4e0d\u5230\u4e5f\u4e0d\u4f1a\u6709\u632b\u8d25\u611f\u3002
    */
    const goodies = shuffle([...FREE_INGREDIENTS]).slice(0, 5).concat(['star', 'star']);
    S.drive = { got: 0 };

    paint('sc-drive', `
      <div class="bg road-scroll">${Art.road()}${Art.road()}</div>
      <div class="layer">
        <div class="pos drive-truck">${Art.truck()}
          <div class="puff p1"></div><div class="puff p2"></div>
        </div>
        ${shuffle(goodies).map((id, i) => `
          <button class="road-item" data-id="${id}"
            style="--lane:${[188, 258, 330][i % 3]}px;--delay:${(i * 0.62).toFixed(2)}s">
            ${id === 'star' ? Art.star() : Art.ingredient(id)}
          </button>`).join('')}
        <div class="banner">${t('driveTitle', { place: I18N.place(L.place) })}</div>
        <div class="drive-bag"><span class="bag-ico">${Art.basket()}</span><b id="driveGot">0</b></div>
        <button class="skip-btn" id="skipDrive">${t('skip')}</button>
      </div>
    `, () => {
      Sound.engine();
      const myGen = gen;
      const counter = $('#driveGot');

      sceneEl.querySelectorAll('.road-item').forEach(btn => {
        btn.addEventListener('click', () => {
          if (busy || btn.dataset.taken) return;
          btn.dataset.taken = '1';
          S.drive.got++;
          Sound.pick(Math.min(S.drive.got - 1, 7));
          if (counter) counter.textContent = S.drive.got;
          burst(btn, 8, ['#ffd23f', '#fff6e6']);
          btn.style.visibility = 'hidden';
        });
      });

      const go = () => { if (isCurrent(myGen)) renderForage(); };
      later(go, 5200);
      on('#skipDrive', go);
    });
  }

  /* ================================================================
     4. \u91c7\u96c6\u98df\u6750
  ================================================================ */
  function renderForage() {
    S.phase = 'forage';
    const L = level();
    const F = S.forage;
    const done = forageDone();

    const foreground = L.place === 'jungle'
      ? Art.svg(
          Art.leaf(-60, -30, 35, 1.5, '#173d2b') +
          Art.leaf(1320, 60, 168, 1.4, '#173d2b') +
          Art.leaf(-30, 780, -48, 1.5, '#1f4a34') +
          Art.leaf(1300, 700, 205, 1.3, '#1f4a34'),
          '0 0 1280 720', 'art-bg')
      : '';

    /* \u8981\u91c7\u4e00\u79cd\u8fd8\u662f\u4e24\u79cd\uff0c\u6a2a\u5e45\u7684\u8bf4\u6cd5\u4e0d\u4e00\u6837 */
    const title = L.targets.length === 1
      ? t('forageTitle', { count: L.targets[0].count, ing: I18N.ing(L.targets[0].id) })
      : t('forageTitle2', {
          count: L.targets[0].count, ing: I18N.ing(L.targets[0].id),
          count2: L.targets[1].count, ing2: I18N.ing(L.targets[1].id)
        });

    /* \u7bee\u5b50\uff1a\u4e00\u79cd\u76ee\u6807\u4e00\u884c\uff0c\u5404\u6570\u5404\u7684 */
    const rows = L.targets.map((tg, ti) => `
      <div class="basket-row" data-t="${ti}">
        <span class="slots">
          ${Array.from({ length: tg.count }, (_, i) =>
            `<span class="slot ${i < F.picked[ti] ? 'full' : ''}">${i < F.picked[ti] ? Art.ingredient(tg.id) : ''}</span>`).join('')}
        </span>
        <span class="count">${F.picked[ti]}<em>/${tg.count}</em></span>
      </div>`).join('');

    paint('sc-forage', `
      <div class="bg">${Art.backdrop(L.place)}</div>
      <div class="layer">
        ${F.items.map((it, i) => it.taken ? '' : `
          <button class="forage-item sway${L.drift ? ' drift' : ''}" data-i="${i}" aria-label="${I18N.ing(it.id)}"
            style="left:${it.x}px;top:${it.y}px;--rot:${it.rot}deg;--sc:${it.sc};animation-delay:${it.delay}s">
            ${Art.ingredient(it.id)}
          </button>`).join('')}
        <div class="fg">${foreground}</div>
        <div class="banner">${title}</div>
        <div class="basket-hud${L.targets.length > 1 ? ' two' : ''}">
          <div class="basket-art">${Art.basket()}</div>
          <div class="basket-rows">${rows}</div>
        </div>
        ${done ? `
          <div class="pos chef-forage pop-in bob">${Art.chef('cheer')}</div>
          <button class="big-btn bottom" id="toCook">${t('backBtn')}</button>` : ''}
      </div>
    `, () => {
      const basketEl = $('.basket-art');
      sceneEl.querySelectorAll('.forage-item').forEach(btn => {
        btn.addEventListener('click', () => {
          if (busy) return;
          const it = F.items[+btn.dataset.i];
          if (it.taken) return;

          const ti = L.targets.findIndex(tg => tg.id === it.id);
          /* \u4e0d\u662f\u8981\u91c7\u7684\u4e1c\u897f\uff0c\u6216\u8005\u8fd9\u4e00\u79cd\u5df2\u7ecf\u91c7\u591f\u4e86 */
          if (ti < 0 || F.picked[ti] >= L.targets[ti].count) {
            shake(btn);
            Sound.oops();
            toast(ti >= 0
              ? t('forageEnough', { ing: I18N.ing(it.id) })
              : t('forageOops', { ing: I18N.ing(L.targets[0].id) }), 'warn');
            return;
          }

          it.taken = true;
          F.picked[ti]++;
          const slotIndex = F.picked[ti] - 1;   // \u8bb0\u4f4f\u81ea\u5df1\u7684\u683c\u5b50\uff0c\u591a\u4e2a\u98df\u6750\u540c\u65f6\u5728\u98de\u4e5f\u4e0d\u4f1a\u586b\u9519
          const wasLast = forageDone();
          Sound.pick(slotIndex);
          btn.style.pointerEvents = 'none';
          burst(btn, 8);
          flyItem(Art.ingredient(it.id), btn, basketEl, {
            onDone: () => {
              const row = sceneEl.querySelector(`.basket-row[data-t="${ti}"]`);
              if (row) {
                const slot = row.querySelectorAll('.slot')[slotIndex];
                if (slot) { slot.innerHTML = Art.ingredient(it.id); slot.classList.add('full'); }
                const c = row.querySelector('.count');
                if (c) c.innerHTML = `${F.picked[ti]}<em>/${L.targets[ti].count}</em>`;
              }
              if (basketEl) { basketEl.classList.remove('nudge'); void basketEl.offsetWidth; basketEl.classList.add('nudge'); }
              if (wasLast) {      // \u6700\u540e\u4e00\u4e2a\u843d\u8fdb\u7bee\u5b50\u624d\u7b97\u9f50
                toast(t('forageDone'), 'good');
                Sound.ding();
                later(renderForage, 700);
              }
            }
          });
          /*
            \u6458\u8d70\u4e4b\u540e\u8981\u628a\u6309\u94ae\u771f\u7684\u5220\u6389\uff0c\u4e0d\u80fd\u53ea\u662f\u8ba9\u5b83\u900f\u660e\u3002
            \u7559\u7740\u7684\u8bdd DOM \u91cc\u4f1a\u6709\u4e2a\u770b\u4e0d\u89c1\u4e5f\u70b9\u4e0d\u4e86\u7684\u5e7d\u7075\u6309\u94ae\uff0c\u8bfb\u5c4f\u8f6f\u4ef6\u7167\u5ff5\u4e0d\u8bef\u3002
          */
          btn.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.4)' }],
            { duration: 220, fill: 'forwards' }).onfinish = () => btn.remove();
        });
      });
      on('#toCook', renderCook);
    });
  }

  /* ================================================================
     5. \u4e0b\u53a8
  ================================================================ */
  function renderCook() {
    S.phase = 'cook';
    const L = level();
    const C = S.cook;
    const allIn = C.stepIndex >= L.steps.length;
    const done = C.cooked;

    const banner = done ? t('dishReady', { dish: I18N.name(L.dish) })
                 : allIn ? t('cookNow')
                 : t('nextIng', { ing: I18N.ing(L.steps[C.stepIndex]) });

    const controls = done ? `
        <div class="pos dish-pop">${Art.dish(L.id)}</div>
        <button class="big-btn bottom" id="serveBtn">${t('serveBtn')}</button>`
      : allIn ? `
        <div class="cook-controls">
          <button class="big-btn" id="cookBtn">${t('cookBtn')[L.appliance]}</button>
          <div class="progress"><i id="prog" style="width:${(C.taps / L.taps) * 100}%"></i></div>
          <p class="hint">${t('cookHint')}</p>
        </div>`
      : `
        <div class="shelf">
          ${C.shelf.map(id => {
            const used = L.steps.indexOf(id) > -1 && L.steps.indexOf(id) < C.stepIndex;
            return `<button class="ing-tile ${used ? 'used' : ''}" data-id="${id}" ${used ? 'disabled' : ''}>
                      ${Art.ingredient(id)}<span>${I18N.ing(id)}</span>
                    </button>`;
          }).join('')}
        </div>`;

    paint('sc-cook', `
      <div class="bg">${Art.kitchen()}</div>
      <div class="layer">
        <div class="card recipe-card">
          <h3>${t('recipeTitle', { dish: I18N.name(L.dish) })}</h3>
          <ol>
            ${L.steps.map((id, i) => `
              <li class="${i < C.stepIndex ? 'done' : ''} ${i === C.stepIndex ? 'now' : ''}">
                <b class="num">${i + 1}</b>
                <span class="ing">${Art.ingredient(id)}</span>
                <span class="nm">${I18N.ing(id)}</span>
                <span class="tick">\u2713</span>
              </li>`).join('')}
          </ol>
        </div>

        <div class="pos appliance-wrap ${allIn ? 'ready' : ''}" id="appliance">
          ${Art.appliance(L.appliance)}
          <div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div>
        </div>
        <div class="pos chef-cook bob">${Art.chef('cook', [0.5, 0.2])}</div>

        <div class="banner">${banner}</div>
        ${controls}
      </div>
    `, () => {
      const appl = $('#appliance');

      sceneEl.querySelectorAll('.ing-tile').forEach(tile => {
        if (tile.disabled) return;
        draggable(tile, {
          targetEl: () => appl,
          onRelease: hit => {
            if (!hit) return;
            const id = tile.dataset.id;
            const need = L.steps[C.stepIndex];
            if (id !== need) {
              shake(tile);
              Sound.oops();
              toast(t('wrongIng', { n: C.stepIndex + 1 }), 'warn');
              return;
            }
            C.stepIndex++;
            tile.disabled = true;
            tile.classList.add('used');
            flyItem(Art.ingredient(id), tile, appl, {
              endScale: 0.3,
              dur: 420,
              onDone: () => {
                Sound.plop();
                appl.classList.remove('bump'); void appl.offsetWidth; appl.classList.add('bump');
                burst(appl, 8, ['#fff6e6', '#ffd23f']);
                /*
                  \u4e2d\u95f4\u6b65\u9aa4\u5c31\u5730\u66f4\u65b0\u98df\u8c31\u5361\u548c\u6a2a\u5e45\uff0c\u4e0d\u6574\u5c4f\u91cd\u7ed8 \u2014\u2014
                  \u91cd\u7ed8\u90a3 ~0.5 \u79d2\u91cc\u70b9\u51fb\u4f1a\u88ab\u541e\u6389\uff0c\u5c0f\u670b\u53cb\u8fde\u70b9\u65f6\u624b\u611f\u5f88\u5dee\u3002
                */
                if (C.stepIndex >= L.steps.length) {
                  later(renderCook, 200);          // \u98df\u6750\u9f50\u4e86\uff0c\u6362\u6210"\u5f00\u706b"\u9762\u677f
                  return;
                }
                sceneEl.querySelectorAll('.recipe-card li').forEach((li, i) => {
                  li.classList.toggle('done', i < C.stepIndex);
                  li.classList.toggle('now', i === C.stepIndex);
                });
                const bn = $('.banner');
                if (bn) bn.textContent = t('nextIng', { ing: I18N.ing(L.steps[C.stepIndex]) });
              }
            });
          }
        });
      });

      on('#cookBtn', () => {
        if (C.cooked) return;
        C.taps++;
        Sound.cookStep(C.taps);
        appl.classList.remove('bump'); void appl.offsetWidth; appl.classList.add('bump');
        const p = $('#prog');
        if (p) p.style.width = Math.min(100, (C.taps / L.taps) * 100) + '%';
        if (C.taps >= L.taps) finishCooking(appl);
      });

      on('#serveBtn', renderServe);
    });
  }

  function finishCooking(appl) {
    S.cook.cooked = true;
    busy = true;
    const controls = $('.cook-controls');
    if (controls) controls.classList.add('hide');
    burst(appl, 26);
    Sound.ding();
    later(() => { busy = false; renderCook(); }, 620);
  }

  /* ================================================================
     6. \u4e0a\u83dc
  ================================================================ */
  function renderServe() {
    S.phase = 'serve';
    const L = level();
    paint('sc-serve', `
      <div class="bg">${Art.street()}</div>
      <div class="layer">
        <div class="pos truck-side">${Art.truck()}</div>
        <div class="pos chef-side bob">${Art.chef('cook', [0.6, 0.2])}</div>
        <div class="pos cust-order bob" id="cust">${Art.customer(L.customer, false, [-0.6, 0.1])}</div>
        <div class="banner">${t('serveTitle', { dish: I18N.name(L.dish) })}</div>
        <div class="chip bottom-chip">${t('serveHint')}</div>
        <div class="pos serve-dish" id="dish">
          <div class="dish-inner float">
            <div class="plate"></div>
            ${Art.dish(L.id)}
          </div>
        </div>
      </div>
    `, () => {
      const dish = $('#dish'), cust = $('#cust');
      draggable(dish, {
        targetEl: () => cust,
        onRelease: hit => {
          if (!hit || S.serve.served) return;
          S.serve.served = true;
          busy = true;
          flyItem(dish.innerHTML, dish, cust, {
            endScale: 0.6,
            onDone: () => {
              Sound.yum();
              cust.innerHTML = Art.customer(L.customer, true, [0, 0]);
              cust.classList.add('happy');
              burst(cust, 22, ['#ef4b52', '#f38fc4', '#ffd23f']);
              const b = $('.banner');
              if (b) b.textContent = t('yum');
              later(() => { busy = false; levelClear(); }, 1200);
            }
          });
          dish.style.visibility = 'hidden';
        }
      });
    });
  }

  /* ================================================================
     1c. \u5c0f\u6e38\u620f \u2014\u2014 \u7ec3\u7684\u662f\u8ddf\u505a\u83dc\u5b8c\u5168\u4e0d\u540c\u7684\u4e24\u79cd\u672c\u4e8b
  ================================================================ */
  function renderMiniMenu() {
    S.phase = 'mini';
    paint('sc-mini', `
      <div class="bg">${Art.street()}</div>
      <div class="layer dim">
        <div class="banner">${t('miniGames')}</div>
        <div class="mini-grid">
          <button class="mini-card" id="goMem">
            <span class="mini-art">${Art.cardBack()}${Art.cardBack()}</span>
            <b>${t('memTitle')}</b><span>${t('memDesc')}</span>
          </button>
          <button class="mini-card" id="goSort">
            <span class="mini-art">${Art.crate('fruit')}${Art.crate('veg')}</span>
            <b>${t('sortTitle')}</b><span>${t('sortDesc')}</span>
          </button>
        </div>
        <button class="big-btn bottom" id="backHome">${t('backHome')}</button>
      </div>
    `, () => {
      on('#goMem', () => renderMemory(4));
      on('#goSort', () => renderSort(true));
      on('#backHome', renderTitle);
    });
  }

  /* ---------------- \u8bb0\u5fc6\u914d\u5bf9 ---------------- */
  function renderMemory(pairs, fresh = true) {
    S.phase = 'memory';
    if (fresh || !S.mem || S.mem.pairs !== pairs) {
      const ids = shuffle(FREE_INGREDIENTS).slice(0, pairs);
      S.mem = {
        pairs,
        cards: shuffle([...ids, ...ids]).map(id => ({ id, up: false, done: false })),
        open: [],       // \u5f53\u524d\u7ffb\u5f00\u8fd8\u6ca1\u5224\u5b9a\u7684
        found: 0,
        pending: null,  // \u7b49\u7740\u76d6\u56de\u53bb\u7684\u90a3\u4e24\u5f20
        locked: false   // \u4e24\u5f20\u7ffb\u5f00\u3001\u6b63\u5728\u7b49\u7740\u76d6\u56de\u53bb
      };
    }
    const M = S.mem;
    const won = M.found >= M.pairs;

    paint('sc-memory', `
      <div class="bg">${Art.street()}</div>
      <div class="layer dim">
        <div class="banner">${won ? t('memWin') : t('memFound', { a: M.found, b: M.pairs - M.found })}</div>
        <div class="mem-board">
          ${M.cards.map((c, i) => `
            <button class="mem-card${c.up || c.done ? ' up' : ''}${c.done ? ' done' : ''}"
                    data-i="${i}" aria-label="${c.up || c.done ? I18N.ing(c.id) : t('memTitle')}">
              <span class="mem-face back">${Art.cardBack()}</span>
              <span class="mem-face front">${Art.ingredient(c.id)}</span>
            </button>`).join('')}
        </div>
        <div class="mem-levels">
          ${[[3, 'memEasy'], [4, 'memMid'], [6, 'memHard']].map(([n, k]) =>
            `<button class="mid-btn${n === M.pairs ? ' on' : ''}" data-p="${n}">${t(k)}</button>`).join('')}
          <button class="mid-btn alt" id="backMini">${t('backHome')}</button>
        </div>
        ${won ? `<div class="pos chef-mini pop-in bob">${Art.chef('cheer')}</div>` : ''}
      </div>
    `, () => {
      /*
        \u76d6\u56de\u53bb\u8fd9\u4ef6\u4e8b\u5fc5\u987b\u6302\u5728\u72b6\u6001\u4e0a\u3001\u6bcf\u6b21\u91cd\u7ed8\u90fd\u91cd\u65b0\u5b89\u6392\u3002
        \u4ee5\u524d\u53ea\u7528\u4e00\u4e2a\u5b9a\u65f6\u5668\uff0c\u91cd\u7ed8\uff08\u6bd4\u5982\u4e2d\u9014\u5207\u8bed\u8a00\uff09\u4f1a\u628a\u5b83\u4f5c\u5e9f\uff0c
        \u7ed3\u679c\u4e24\u5f20\u724c\u6c38\u8fdc\u7ffb\u7740\u3001M.locked \u6c38\u8fdc\u4e3a\u771f\uff0c\u6574\u5c40\u5c31\u6b7b\u5728\u90a3\u513f\u4e86\u3002
      */
      function flipBackSoon() {
        later(() => {
          if (!M.pending) return;
          const [x, y] = M.pending;
          M.cards[x].up = M.cards[y].up = false;
          M.pending = null;
          M.locked = false;
          sceneEl.querySelectorAll('.mem-card').forEach(el => {
            const j = +el.dataset.i;
            if (j === x || j === y) {
              el.classList.remove('up');
              el.setAttribute('aria-label', t('memTitle'));
            }
          });
        }, 1000);
      }
      if (M.locked && M.pending) flipBackSoon();   // \u91cd\u7ed8\u540e\u63a5\u7740\u628a\u724c\u76d6\u56de\u53bb

      sceneEl.querySelectorAll('.mem-card').forEach(btn => {
        btn.addEventListener('click', () => {
          if (busy || M.locked) return;
          const i = +btn.dataset.i, c = M.cards[i];
          if (c.up || c.done) return;

          c.up = true;
          btn.classList.add('up');
          btn.setAttribute('aria-label', I18N.ing(c.id));
          M.open.push(i);
          Sound.tap();

          if (M.open.length < 2) return;

          const [a, b] = M.open;
          M.open = [];
          if (M.cards[a].id === M.cards[b].id) {
            /* \u914d\u4e0a\u4e86 */
            M.cards[a].done = M.cards[b].done = true;
            M.found++;
            Sound.pick(M.found - 1);
            sceneEl.querySelectorAll('.mem-card').forEach(el => {
              if (+el.dataset.i === a || +el.dataset.i === b) { el.classList.add('done'); burst(el, 8); }
            });
            const bn = $('.banner');
            if (M.found >= M.pairs) {
              Sound.fanfare();
              later(() => renderMemory(M.pairs, false), 700);
            } else if (bn) {
              bn.textContent = t('memFound', { a: M.found, b: M.pairs - M.found });
            }
          } else {
            /* \u6ca1\u914d\u4e0a\uff0c\u76d6\u56de\u53bb \u2014\u2014 \u7559\u591f\u770b\u6e05\u7684\u65f6\u95f4 */
            M.locked = true;
            M.pending = [a, b];
            Sound.oops();
            flipBackSoon();
          }
        });
      });

      sceneEl.querySelectorAll('.mem-levels .mid-btn[data-p]').forEach(b =>
        b.addEventListener('click', () => { if (!busy) { Sound.tap(); renderMemory(+b.dataset.p); } }));
      on('#backMini', renderMiniMenu);
    });
  }

  /* ---------------- \u6c34\u679c\u8fd8\u662f\u852c\u83dc ---------------- */
  function renderSort(fresh = true) {
    S.phase = 'sort';
    if (fresh || !S.sort) {
      S.sort = {
        queue: shuffle([...shuffle(FRUITS).slice(0, 5), ...shuffle(VEGGIES).slice(0, 5)]),
        done: 0
      };
    }
    const So = S.sort;
    const cur = So.queue[0];
    const won = !cur;

    paint('sc-sort', `
      <div class="bg">${Art.kitchen()}</div>
      <div class="layer">
        <div class="banner">${won ? t('sortWin') : t('sortTitle')}</div>
        ${won ? '' : `<div class="chip">${t('sortLeft', { n: So.queue.length })}</div>`}

        ${cur ? `<div class="pos sort-item pop-in" id="sortItem">${Art.ingredient(cur)}</div>` : ''}

        <button class="crate-btn left" data-kind="fruit" aria-label="${t('sortFruit')}">
          ${Art.crate('fruit')}<b>${t('sortFruit')}</b>
        </button>
        <button class="crate-btn right" data-kind="veg" aria-label="${t('sortVeg')}">
          ${Art.crate('veg')}<b>${t('sortVeg')}</b>
        </button>

        ${won ? `
          <div class="pos chef-mini pop-in bob">${Art.chef('cheer')}</div>
          <div class="sort-actions">
            <button class="big-btn" id="sortAgain">${t('memAgain')}</button>
            <button class="mid-btn alt" id="backMini">${t('backHome')}</button>
          </div>`
        : `<button class="mid-btn alt corner" id="backMini">${t('backHome')}</button>`}
      </div>
    `, () => {
      const item = $('#sortItem');
      /*
        \u4e00\u5c4f\u53ea\u8ba4\u4e00\u6b21\u4f5c\u7b54\u3002\u5c0f\u670b\u53cb\u4f1a\u5bf9\u7740\u7b50\u8fde\u6309\u597d\u51e0\u4e0b\uff0c
        \u6ca1\u8fd9\u4e2a\u95f8\u95e8\u7684\u8bdd\u6309 4 \u4e0b\u5c31\u8df3\u8fc7 4 \u9053\u9898\uff0c\u9898\u76ee\u54d7\u54d7\u5730\u5c11\u3002
      */
      let answered = false;
      sceneEl.querySelectorAll('.crate-btn').forEach(cb => {
        cb.addEventListener('click', () => {
          if (busy || !cur || answered) return;
          const right = (cb.dataset.kind === 'fruit') === FRUITS.includes(cur);
          if (!right) {
            shake(cb);
            Sound.oops();
            toast(t('sortOops', { ing: I18N.ing(cur) }), 'warn');
            return;
          }
          answered = true;
          So.queue.shift();
          So.done++;
          Sound.pick(Math.min(So.done - 1, 7));
          if (item) item.style.visibility = 'hidden';
          flyItem(Art.ingredient(cur), item || cb, cb, {
            endScale: 0.4,
            onDone: () => {
              burst(cb, 10);
              Sound.plop();
              later(() => renderSort(false), 140);
            }
          });
        });
      });
      on('#sortAgain', () => renderSort(true));
      on('#backMini', renderMiniMenu);
    });
  }

  /* ================================================================
     6b. \u81ea\u7531\u53a8\u623f \u2014\u2014 \u60f3\u653e\u4ec0\u4e48\u653e\u4ec0\u4e48\uff0c\u6ca1\u6709\u5bf9\u9519\uff0c\u505a\u5b8c\u8bf7\u5ba2\u4eba\u5403
  ================================================================ */
  const APPLIANCES = ['blender', 'pot', 'griddle', 'oven', 'freezer'];

  function renderFree(reset = true) {
    S.phase = 'free';
    if (reset || !S.free) S.free = { picked: [], appliance: 'blender', made: false, served: false };
    const F = S.free;
    const full = F.picked.length >= 6;

    const madeArt = F.made ? Art.creation(Art.blend(F.picked), F.appliance, F.picked) : '';

    paint('sc-free', `
      <div class="bg">${Art.kitchen()}</div>
      <div class="layer">
        <div class="banner">${F.made ? t('freeDone') : t('freeHint')}</div>

        <div class="pos free-appliance ${F.made ? 'ready' : ''}" id="appliance">
          ${Art.appliance(F.appliance)}
          <div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div>
        </div>

        <div class="free-added">
          ${F.picked.map(id => `<span class="added-chip">${Art.ingredient(id)}</span>`).join('')}
          ${F.picked.length ? '' : `<span class="added-empty">${t('freeEmpty')}</span>`}
        </div>

        ${F.made ? `
          <div class="pos chef-free bob">${Art.chef('cheer')}</div>
          <div class="pos free-made pop-in" id="made">${madeArt}</div>
          <div class="free-actions">
            <button class="big-btn" id="freeAgain">${t('freeAgain')}</button>
            <button class="mid-btn" id="backHome">${t('backHome')}</button>
          </div>`
        : `
          <div class="pick-row">
            ${APPLIANCES.map(a => `
              <button class="pick-appl${a === F.appliance ? ' on' : ''}" data-a="${a}"
                      aria-label="${t('cookBtn')[a]}">${Art.appliance(a)}</button>`).join('')}
          </div>
          <div class="palette">
            ${FREE_INGREDIENTS.map(id => `
              <button class="pal-tile" data-id="${id}" ${full ? 'disabled' : ''}
                      aria-label="${I18N.ing(id)}">${Art.ingredient(id)}</button>`).join('')}
          </div>
          <div class="free-actions">
            <button class="big-btn" id="freeCook" ${F.picked.length ? '' : 'disabled'}>${t('freeCook')}</button>
            <button class="mid-btn" id="freeClear" ${F.picked.length ? '' : 'disabled'}>${t('freeClear')}</button>
            <button class="mid-btn" id="backHome">${t('backHome')}</button>
          </div>`}
      </div>
    `, () => {
      const appl = $('#appliance');

      /*
        \u653e\u4e00\u6837\u5c31\u5730\u66f4\u65b0\uff0c\u4e0d\u6574\u5c4f\u91cd\u7ed8 \u2014\u2014
        \u91cd\u7ed8\u90a3\u51e0\u767e\u6beb\u79d2\u91cc\u7684\u70b9\u51fb\u4f1a\u88ab\u541e\u6389\uff0c\u5c0f\u670b\u53cb\u8fde\u7740\u70b9\u5c31\u53ea\u8fdb\u4e86\u4e00\u534a\u3002
      */
      const refreshFree = () => {
        const box = $('.free-added');
        if (box) {
          box.innerHTML = F.picked.length
            ? F.picked.map(id => `<span class="added-chip">${Art.ingredient(id)}</span>`).join('')
            : `<span class="added-empty">${t('freeEmpty')}</span>`;
        }
        const isFull = F.picked.length >= 6;
        sceneEl.querySelectorAll('.pal-tile').forEach(el => { el.disabled = isFull; });
        const cook = $('#freeCook'), clr = $('#freeClear');
        if (cook) cook.disabled = !F.picked.length;
        if (clr) clr.disabled = !F.picked.length;
      };

      sceneEl.querySelectorAll('.pal-tile').forEach(tile => {
        tile.addEventListener('click', () => {
          if (busy || tile.disabled || F.picked.length >= 6) return;
          const id = tile.dataset.id;
          F.picked.push(id);
          Sound.plop();
          refreshFree();
          flyItem(Art.ingredient(id), tile, appl, {
            endScale: 0.3, dur: 420,
            onDone: () => {
              appl.classList.remove('bump'); void appl.offsetWidth; appl.classList.add('bump');
              burst(appl, 6, ['#fff6e6', '#ffd23f']);
            }
          });
        });
      });

      /* \u6362\u53a8\u5177\u4e5f\u5c31\u5730\u6362\uff0c\u522b\u628a\u6574\u5c4f\u63a8\u5012\u91cd\u6765 */
      sceneEl.querySelectorAll('.pick-appl').forEach(b => b.addEventListener('click', () => {
        if (busy) return;
        Sound.tap();
        F.appliance = b.dataset.a;
        sceneEl.querySelectorAll('.pick-appl').forEach(x => x.classList.toggle('on', x === b));
        appl.innerHTML = Art.appliance(F.appliance) +
          '<div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div>';
        appl.classList.remove('bump'); void appl.offsetWidth; appl.classList.add('bump');
      }));

      on('#freeCook', () => {
        F.made = true;
        Sound.cookStep(2);
        later(() => { Sound.ding(); renderFree(false); }, 420);
      });
      on('#freeClear', () => { F.picked = []; refreshFree(); });
      on('#freeAgain', () => renderFree(true));
      on('#backHome', renderTitle);
    });
  }

  /* ================================================================
     7. \u8fc7\u5173 / \u901a\u5173
  ================================================================ */
  function levelClear() {
    S.stars++;
    Store.set('gulu.stars', S.stars);
    markDone(level().id);
    updateStars();
    Sound.fanfare();

    const last = S.level >= LEVELS.length - 1;
    const panel = document.createElement('div');
    panel.className = 'overlay';
    panel.innerHTML = `
      <div class="card panel pop-in">
        <div class="big-star">${Art.star()}</div>
        <h2>${t('levelClear', { n: S.level + 1 })}</h2>
        <p class="sub">${I18N.name(level().dish)}</p>
        <button class="big-btn" id="nextLv">${t('nextBtn')}</button>
      </div>`;
    sceneEl.appendChild(panel);
    confetti(30);
    /*
      \u9762\u677f\u662f"\u5f39"\u8fdb\u6765\u7684\uff0c\u8fd9\u534a\u79d2\u91cc\u6309\u94ae\u4e2d\u5fc3\u4f1a\u79fb\u52a8 40 \u591a\u50cf\u7d20\uff0c\u6bd4\u6309\u94ae\u534a\u9ad8\u8fd8\u591a\u3002
      \u5c0f\u670b\u53cb\u624b\u5feb\uff0c\u7167\u7740\u521a\u770b\u5230\u7684\u4f4d\u7f6e\u6233\u4e0b\u53bb\u5c31\u843d\u7a7a\u4e86\uff0c\u6233\u4e86\u6ca1\u53cd\u5e94\u6700\u8ba9\u4eba\u70e6\u3002
      \u6240\u4ee5\u6574\u5757\u9762\u677f\u90fd\u63a5\u53d7\u70b9\u51fb \u2014\u2014 \u53cd\u6b63\u8fd9\u4e00\u5c4f\u53ea\u6709"\u7ee7\u7eed"\u8fd9\u4e00\u4e2a\u53bb\u5904\u3002
    */
    panel.addEventListener('click', () => {
      Sound.tap();
      panel.remove();
      if (last) renderFinale();
      else { S.level++; startLevel(); }
    });
  }

  function renderFinale() {
    S.phase = 'finale';
    paint('sc-finale', `
      <div class="bg">${Art.street()}</div>
      <div class="layer">
        <div class="pos truck-title">${Art.truck()}</div>
        <div class="crowd">
          ${LEVELS.map((L, i) =>
            `<div class="crowd-one bob" style="animation-delay:${i * 0.2}s">${Art.customer(L.customer, true)}</div>`).join('')}
        </div>
        <div class="pos chef-title bob">${Art.chef('cheer')}</div>
        <div class="card title-card">
          <h1>${t('allDone')}</h1>
          <p class="sub">${t('allDoneSub', { n: S.stars })}</p>
          <button class="big-btn" id="again">${t('replay')}</button>
        </div>
      </div>
    `, () => {
      Sound.fanfare();
      confetti(60);
      on('#again', () => { S.level = 0; startLevel(); });
    });
  }

  function confetti(n) {
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'particle confetti';
      p.style.left = Math.random() * W + 'px';
      p.style.top = '-20px';
      p.style.background = ['#ffd23f', '#ef4b52', '#5fbf7d', '#5aa8e8', '#8b5fe0', '#f38fc4'][i % 6];
      fxEl.appendChild(p);
      p.animate([
        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
        { transform: `translateY(${H + 80}px) translateX(${Math.random() * 200 - 100}px) rotate(${Math.random() * 900}deg)`, opacity: 0.9 }
      ], { duration: 1800 + Math.random() * 1600, delay: Math.random() * 700, easing: 'cubic-bezier(.3,.5,.6,1)' })
        .onfinish = () => p.remove();
    }
  }

  /* ---------------- \u5f53\u524d\u573a\u666f\u91cd\u7ed8\uff08\u5207\u6362\u8bed\u8a00\u65f6\u7528\uff09 ---------------- */
  function repaint() {
    ({
      title: renderTitle, select: renderLevelSelect, free: () => renderFree(false),
      mini: renderMiniMenu, memory: () => renderMemory(S.mem ? S.mem.pairs : 4, false),
      sort: () => renderSort(false),
      order: renderOrder, drive: renderDrive, forage: renderForage,
      cook: renderCook, serve: renderServe, finale: renderFinale
    }[S.phase] || renderTitle)();
  }

  /* ---------------- HUD ---------------- */
  document.getElementById('btn-home').addEventListener('click', () => { Sound.tap(); renderTitle(); });

  /* \u91cd\u65b0\u52a0\u8f7d\u6574\u4e2a\u9875\u9762 \u2014\u2014 \u5361\u4f4f\u4e86\u6216\u8005\u60f3\u4ece\u5934\u6765\uff0c\u8fd9\u4e2a\u6700\u76f4\u63a5 */
  document.getElementById('btn-reload').addEventListener('click', () => {
    Sound.tap();
    location.reload();
  });

  const soundBtn = document.getElementById('btn-sound');
  document.body.classList.toggle('muted', !Sound.enabled);
  soundBtn.addEventListener('click', () => {
    document.body.classList.toggle('muted', !Sound.toggle());
  });

  const langBtn = document.getElementById('btn-lang');
  langBtn.textContent = I18N.lang === 'zh' ? 'EN' : '\u4e2d';
  document.documentElement.lang = I18N.lang === 'zh' ? 'zh-CN' : 'en';
  langBtn.addEventListener('click', () => {
    Sound.tap();
    const l = I18N.toggle();
    langBtn.textContent = l === 'zh' ? 'EN' : '\u4e2d';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    if (S.phase === 'serve' && S.serve && S.serve.served) return;   // \u522b\u6253\u65ad\u5403\u4e1c\u897f\u7684\u52a8\u753b
    repaint();
  });

  /*
    \u6d4f\u89c8\u5668\u8981\u6c42\u5148\u6709\u7528\u6237\u4ea4\u4e92\u624d\u8ba9\u51fa\u58f0\u3002
    \u952e\u76d8\u4e5f\u7b97\u4ea4\u4e92 \u2014\u2014 \u53ea\u542c pointerdown \u7684\u8bdd\uff0c\u7eaf\u952e\u76d8\u73a9\u7684\u4eba\u4e00\u8def\u662f\u9759\u97f3\u7684\u3002
    \u53e6\u5916\u9996\u6b21\u4e0d\u4e00\u5b9a\u6210\u529f\uff08\u97f3\u9891\u4e0a\u4e0b\u6587\u53ef\u80fd\u8fd8\u6ca1\u5c31\u7eea\uff09\uff0c\u6240\u4ee5\u786e\u8ba4\u54cd\u8d77\u6765\u4e86\u624d\u64a4\u76d1\u542c\u3002
  */
  const unlockAudio = () => {
    Sound.unlock();
    if (Sound.running) {
      window.removeEventListener('pointerdown', unlockAudio);
      window.removeEventListener('keydown', unlockAudio);
    }
  };
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('keydown', unlockAudio);

  /* ---------------- \u542f\u52a8 ---------------- */
  fit();
  updateStars();
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  renderTitle();
})();
</script>
